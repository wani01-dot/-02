<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#f5f7fa"
  />

  <title>ワラいどっとこむ</title>

  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #111827;
      --sub: #687386;
      --border: #e4e9f0;
      --soft: #f1f4f8;

      --maison: #e74c3c;
      --pyuto: #f4c430;
      --nansui: #3498db;

      --accent: #1f6ed4;
      --danger: #ed4d43;

      --shadow:
        0 7px 28px rgba(20, 32, 54, 0.06);

      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      background:
        linear-gradient(
          180deg,
          #fafbfd 0,
          #f3f5f8 100%
        );
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(40px + env(safe-area-inset-bottom));
    }

    /* ========================================
       HEADER
    ======================================== */

    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 2px 10px 15px;
    }

    .brand-logo {
      width: 55px;
      height: 55px;
      flex: 0 0 55px;
    }

    .brand-text {
      flex: 1;
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(25px, 7vw, 35px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: #5f6c80;
      font-size: 14px;
      font-weight: 700;
    }

    .menu-button {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #1f2937;
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
    }

    /* ========================================
       LEGEND
    ======================================== */

    .legend {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow-x: auto;
      padding: 14px 17px;
      margin-bottom: 14px;
      border: 1px solid #edf0f4;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      scrollbar-width: none;
    }

    .legend::-webkit-scrollbar {
      display: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      font-size: 16px;
      font-weight: 800;
    }

    .legend-dot {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      flex: 0 0 27px;
    }

    .legend-help {
      padding-left: 15px;
      border-left: 1px solid var(--border);
      color: #697588;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    /* ========================================
       CARD
    ======================================== */

    .surface {
      border: 1px solid #edf0f4;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: var(--shadow);
    }

    /* ========================================
       CALENDAR
    ======================================== */

    .calendar-card {
      padding: 10px 6px 8px;
    }

    .month-header {
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      padding: 2px 5px 10px;
    }

    .month-title {
      text-align: center;
      font-size: clamp(25px, 7vw, 34px);
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .month-button {
      width: 50px;
      height: 50px;
      border: 0;
      border-radius: 50%;
      background: #f3f5f8;
      color: #132033;
      font-size: 36px;
      line-height: 1;
      cursor: pointer;
    }

    .week-row,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .week-row {
      padding: 0 1px;
    }

    .weekday {
      padding: 7px 0 10px;
      text-align: center;
      color: #526075;
      font-size: 13px;
      font-weight: 800;
    }

    .calendar-grid {
      overflow: hidden;
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
      border-radius: 12px;
    }

    .day-cell {
      position: relative;
      min-width: 0;
      min-height: 104px;
      padding: 8px 6px 5px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }

    .day-cell.other-month {
      background: #fafbfc;
      color: #b9c0ca;
    }

    .day-cell.selected {
      z-index: 1;
      background:
        linear-gradient(
          135deg,
          #fff7f6,
          #fffafa
        );
      box-shadow:
        inset 0 0 0 1.5px #ffb7b2;
    }

    .day-number {
      min-height: 25px;
      font-size: 19px;
      line-height: 1;
      font-weight: 900;
    }

    .day-cell.selected .day-number {
      color: #cf251d;
    }

    .performer-counts {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      margin-top: 3px;
    }

    .performer-count {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      font-weight: 800;
      font-size: 15px;
    }

    .mini-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      flex: 0 0 30px;
    }

    .day-total {
      position: absolute;
      right: 7px;
      bottom: 6px;
      color: #68758a;
      font-size: 13px;
      font-weight: 700;
    }

    /* ========================================
       DAY EVENTS
    ======================================== */

    .day-section {
      margin-top: 14px;
      padding: 15px 10px 11px;
    }

    .day-section-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 4px 12px;
    }

    .day-section-title {
      margin: 0;
      font-size: clamp(23px, 7vw, 32px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.035em;
    }

    .day-section-count {
      color: #657286;
      font-size: 15px;
      font-weight: 700;
    }

    .selected-label {
      margin-left: auto;
      padding: 10px 15px;
      border-radius: 999px;
      background: #fff0ef;
      color: #ec4c43;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .event-list {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fff;
    }

    .event-row {
      display: grid;
      grid-template-columns: 78px auto 1fr 26px;
      align-items: center;
      gap: 8px;
      min-height: 67px;
      padding: 8px 8px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: #fff;
      width: 100%;
      text-align: left;
      color: var(--text);
      cursor: pointer;
    }

    .event-row:last-child {
      border-bottom: 0;
    }

    .event-time {
      padding-left: 6px;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }

    .event-badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      max-width: 75px;
    }

    .event-badges .mini-badge {
      width: 37px;
      height: 37px;
      flex-basis: 37px;
      font-size: 15px;
    }

    .event-main {
      min-width: 0;
    }

    .event-title {
      overflow: hidden;
      margin-bottom: 3px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .event-venue {
      overflow: hidden;
      color: #6f7b8e;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .event-arrow {
      color: #758195;
      font-size: 27px;
      font-weight: 300;
    }

    .view-all-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 15px 12px;
      border: 0;
      border-radius: 999px;
      background: #f2f4f7;
      color: #172033;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .empty-message {
      padding: 27px 15px;
      text-align: center;
      color: #7c8797;
      font-weight: 700;
    }

    /* ========================================
       DRAWER
    ======================================== */

    .drawer-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      visibility: hidden;
      background: rgba(15, 23, 42, 0);
      transition:
        background 0.2s,
        visibility 0.2s;
    }

    .drawer-overlay.open {
      visibility: visible;
      background: rgba(15, 23, 42, 0.42);
    }

    .drawer {
      position: absolute;
      top: 0;
      left: 0;
      width: min(82vw, 390px);
      height: 100%;
      overflow-y: auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        17px
        calc(25px + env(safe-area-inset-bottom));
      background: #fff;
      transform: translateX(-102%);
      transition: transform 0.23s ease;
      box-shadow: 15px 0 40px rgba(15, 23, 42, 0.15);
    }

    .drawer-overlay.open .drawer {
      transform: translateX(0);
    }

    .drawer-close {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 50%;
      background: #f3f5f7;
      font-size: 25px;
      cursor: pointer;
    }

    .drawer-title {
      margin: 18px 6px 2px;
      font-size: 25px;
      font-weight: 900;
    }

    .drawer-subtitle {
      margin: 0 6px 18px;
      color: #6c788b;
      font-size: 13px;
      font-weight: 700;
    }

    .drawer-menu {
      display: grid;
      gap: 5px;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #1b2535;
      text-align: left;
      font-weight: 800;
      cursor: pointer;
    }

    .drawer-item.active {
      background: #edf5ff;
      color: #1669c9;
    }

    .drawer-icon {
      width: 23px;
      text-align: center;
      font-size: 19px;
    }

    .drawer-badge {
      min-width: 24px;
      margin-left: auto;
      padding: 3px 7px;
      border-radius: 999px;
      background: #f35467;
      color: #fff;
      text-align: center;
      font-size: 11px;
      font-weight: 900;
    }

    .drawer-divider {
      height: 1px;
      margin: 8px 3px;
      background: var(--border);
    }

    .drawer-version {
      padding: 20px 8px 0;
      color: #9aa3af;
      font-size: 11px;
    }

    /* ========================================
       GENERIC PAGE
    ======================================== */

    .page-section {
      display: none;
      padding: 17px;
    }

    .page-section.show {
      display: block;
    }

    .page-title {
      margin: 0 0 16px;
      font-size: 26px;
      font-weight: 900;
    }

    .page-subtitle {
      margin: -9px 0 17px;
      color: #748094;
      font-size: 13px;
      line-height: 1.6;
    }

    .content-card {
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fff;
    }

    .content-card-title {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: 900;
    }

    .content-card-sub {
      color: #6d798b;
      font-size: 12px;
      line-height: 1.6;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      background: #fff;
      font-size: 16px;
    }

    .section-label {
      margin: 18px 0 9px;
      font-size: 18px;
      font-weight: 900;
    }

    .source-pill,
    .status-pill,
    .performer-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
    }

    .source-pill {
      background: #eef2f6;
      color: #3f4b5e;
    }

    .status-pill {
      background: #fff0ef;
      color: #d93f36;
    }

    .performer-pill {
      color: #fff;
    }

    .result-row {
      width: 100%;
      padding: 13px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fff;
      text-align: left;
      cursor: pointer;
    }

    .result-date {
      margin-bottom: 4px;
      color: #667286;
      font-size: 12px;
      font-weight: 800;
    }

    .result-title {
      font-size: 15px;
      font-weight: 900;
    }

    .result-sub {
      margin-top: 4px;
      color: #758094;
      font-size: 12px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 3px;
      border-bottom: 1px solid var(--border);
    }

    .settings-row:last-child {
      border-bottom: 0;
    }

    .toggle {
      width: 52px;
      height: 31px;
      position: relative;
      border: 0;
      border-radius: 999px;
      background: #d7dce3;
      cursor: pointer;
    }

    .toggle::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #fff;
      content: "";
      box-shadow: 0 2px 5px rgba(0,0,0,.15);
      transition: .18s;
    }

    .toggle.on {
      background: #3183df;
    }

    .toggle.on::after {
      left: 24px;
    }

    /* ========================================
       DETAIL SHEET
    ======================================== */

    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, 0.44);
    }

    .sheet-overlay.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 760px;
      max-height: 88vh;
      overflow-y: auto;
      padding:
        22px 18px
        calc(28px + env(safe-area-inset-bottom));
      border-radius: 25px 25px 0 0;
      background: #fff;
      box-shadow:
        0 -15px 50px rgba(15, 23, 42, 0.14);
    }

    .sheet-handle {
      width: 48px;
      height: 5px;
      margin: -8px auto 17px;
      border-radius: 999px;
      background: #cdd3db;
    }

    .sheet-close {
      float: right;
      width: 41px;
      height: 41px;
      border: 0;
      border-radius: 50%;
      background: #f1f3f6;
      font-size: 23px;
      cursor: pointer;
    }

    .sheet-title {
      clear: none;
      padding-right: 50px;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 900;
    }

    .sheet-meta {
      margin-top: 11px;
      color: #606d80;
      font-size: 14px;
      line-height: 1.8;
    }

    .sheet-block {
      margin-top: 20px;
      padding-top: 17px;
      border-top: 1px solid var(--border);
    }

    .sheet-block-title {
      margin-bottom: 9px;
      font-size: 16px;
      font-weight: 900;
    }

    .ticket-option {
      padding: 11px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: #f7f8fa;
    }

    .source-link {
      display: block;
      margin-top: 8px;
      padding: 12px;
      border-radius: 11px;
      background: #edf5ff;
      color: #176ac7;
      text-decoration: none;
      font-weight: 900;
    }

    .favorite-button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 1px solid #e2e6ec;
      border-radius: 999px;
      background: #fff;
      color: #1b2535;
      font-weight: 900;
      cursor: pointer;
    }

    .favorite-button.active {
      border-color: #ffd56a;
      background: #fff8dd;
    }

    /* ========================================
       DESKTOP / LARGE PHONE
    ======================================== */

    @media (min-width: 600px) {
      .day-cell {
        min-height: 120px;
      }

      .event-title {
        font-size: 15px;
      }

      .calendar-card {
        padding-left: 12px;
        padding-right: 12px;
      }
    }

    @media (max-width: 390px) {
      .app {
        padding-left: 8px;
        padding-right: 8px;
      }

      .legend {
        gap: 11px;
        padding-left: 11px;
        padding-right: 11px;
      }

      .legend-help {
        display: none;
      }

      .day-cell {
        min-height: 94px;
        padding-left: 4px;
        padding-right: 4px;
      }

      .mini-badge {
        width: 27px;
        height: 27px;
        flex-basis: 27px;
        font-size: 12px;
      }

      .performer-count {
        gap: 3px;
        font-size: 13px;
      }

      .event-row {
        grid-template-columns: 63px auto 1fr 21px;
        gap: 5px;
      }

      .event-time {
        padding-left: 2px;
        font-size: 15px;
      }

      .event-badges .mini-badge {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="app-header">

      <svg
        class="brand-logo"
        viewBox="0 0 100 100"
        aria-hidden="true"
      >
        <circle
          cx="50"
          cy="53"
          r="37"
          fill="#fff"
          stroke="#111827"
          stroke-width="0"
        />

        <path
          d="M15 49C15 20 34 9 52 9c22 0 35 13 36 33-12-2-25-8-34-17-8 12-20 20-39 24z"
          fill="#101827"
        />

        <circle cx="36" cy="52" r="5" fill="#101827"/>
        <circle cx="65" cy="52" r="5" fill="#101827"/>

        <path
          d="M37 70c8 8 19 8 27 0"
          fill="none"
          stroke="#101827"
          stroke-width="6"
          stroke-linecap="round"
        />
      </svg>

      <div class="brand-text">
        <h1 class="brand-title">
          ワラいどっとこむ
        </h1>

        <div class="brand-subtitle">
          お笑いライブのスケジュール
        </div>
      </div>

      <button
        id="menuButton"
        class="menu-button"
        aria-label="メニュー"
      >
        ☰
      </button>

    </header>

    <!-- ======================================
         LEGEND
    ======================================= -->

    <div
      id="legend"
      class="legend"
    ></div>

    <!-- ======================================
         CALENDAR VIEW
    ======================================= -->

    <div id="calendarView">

      <section class="surface calendar-card">

        <div class="month-header">

          <button
            id="prevMonth"
            class="month-button"
            aria-label="前の月"
          >
            ‹
          </button>

          <div
            id="monthTitle"
            class="month-title"
          ></div>

          <button
            id="nextMonth"
            class="month-button"
            aria-label="次の月"
          >
            ›
          </button>

        </div>

        <div class="week-row">
          <div class="weekday">月</div>
          <div class="weekday">火</div>
          <div class="weekday">水</div>
          <div class="weekday">木</div>
          <div class="weekday">金</div>
          <div class="weekday">土</div>
          <div class="weekday">日</div>
        </div>

        <div
          id="calendarGrid"
          class="calendar-grid"
        ></div>

      </section>

      <section
        id="daySection"
        class="surface day-section"
      ></section>

    </div>

    <!-- ======================================
         OTHER PAGES
    ======================================= -->

    <section
      id="pageSection"
      class="surface page-section"
    ></section>

  </main>

  <!-- ========================================
       DRAWER
  ========================================= -->

  <div
    id="drawerOverlay"
    class="drawer-overlay"
  >

    <aside
      id="drawer"
      class="drawer"
    >

      <button
        id="drawerClose"
        class="drawer-close"
      >
        ×
      </button>

      <div class="drawer-title">
        ワラいどっとこむ
      </div>

      <div class="drawer-subtitle">
        今日のライブ追いかけよう
      </div>

      <div class="drawer-menu">

        <button
          class="drawer-item active"
          data-page="calendar"
        >
          <span class="drawer-icon">▣</span>
          カレンダー
        </button>

        <button
          class="drawer-item"
          data-page="new"
        >
          <span class="drawer-icon">✨</span>
          新着ライブ
          <span
            id="newBadge"
            class="drawer-badge"
          >0</span>
        </button>

        <button
          class="drawer-item"
          data-page="favorites"
        >
          <span class="drawer-icon">⭐</span>
          行きたいライブ
          <span
            id="favoriteBadge"
            class="drawer-badge"
          >0</span>
        </button>

        <button
          class="drawer-item"
          data-page="sales"
        >
          <span class="drawer-icon">🎫</span>
          販売開始が近いもの
          <span
            id="saleBadge"
            class="drawer-badge"
          >0</span>
        </button>

        <div class="drawer-divider"></div>

        <button
          class="drawer-item"
          data-page="search"
        >
          <span class="drawer-icon">⌕</span>
          ライブを検索
        </button>

        <button
          class="drawer-item"
          data-page="performers"
        >
          <span class="drawer-icon">♟</span>
          出演者一覧
        </button>

        <button
          class="drawer-item"
          data-page="coappearance"
        >
          <span class="drawer-icon">🎭</span>
          共演検索
        </button>

        <div class="drawer-divider"></div>

        <button
          class="drawer-item"
          data-page="settings"
        >
          <span class="drawer-icon">⚙</span>
          設定
        </button>

        <button
          class="drawer-item"
          data-page="help"
        >
          <span class="drawer-icon">?</span>
          ヘルプ・使い方
        </button>

      </div>

      <div class="drawer-version">
        v2.4.0
      </div>

    </aside>

  </div>

  <!-- ========================================
       DETAIL SHEET
  ========================================= -->

  <div
    id="sheetOverlay"
    class="sheet-overlay"
  >

    <div
      id="sheet"
      class="sheet"
    ></div>

  </div>

<script>
(() => {

  /* =========================================
     基本設定
  ========================================= */

  const DEFAULT_PERFORMERS = [
    {
      id: "maison",
      name: "めぞん",
      color: "#E74C3C",
      short: "め",
    },
    {
      id: "pyuto",
      name: "ピュート",
      color: "#F4C430",
      short: "ピ",
    },
    {
      id: "nansui",
      name: "軟水",
      color: "#3498DB",
      short: "軟",
    },
  ];

  const WEEKDAYS = [
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土",
  ];

  const FAVORITES_KEY =
    "warai-dot-com-favorites";

  const VISIBLE_KEY =
    "warai-dot-com-visible-performers";

  const SALE_NEAR_DAYS = 7;
  const SALE_STARTED_DAYS = 5;

  let rawEvents = [];
  let groups = [];

  let performers = [
    ...DEFAULT_PERFORMERS
  ];

  let performerMap = {};

  let favorites =
    new Set(
      readStorageArray(
        FAVORITES_KEY
      )
    );

  let visiblePerformers =
    new Set(
      readStorageArray(
        VISIBLE_KEY
      )
    );

  let currentMonth =
    new Date(
      new Date().getFullYear(),
      new Date().getMonth(),
      1
    );

  let selectedDate =
    formatDateKey(
      new Date()
    );

  let currentPage =
    "calendar";

  let dayExpanded =
    false;


  /* =========================================
     DOM
  ========================================= */

  const legend =
    document.getElementById(
      "legend"
    );

  const monthTitle =
    document.getElementById(
      "monthTitle"
    );

  const calendarGrid =
    document.getElementById(
      "calendarGrid"
    );

  const daySection =
    document.getElementById(
      "daySection"
    );

  const calendarView =
    document.getElementById(
      "calendarView"
    );

  const pageSection =
    document.getElementById(
      "pageSection"
    );

  const drawerOverlay =
    document.getElementById(
      "drawerOverlay"
    );

  const sheetOverlay =
    document.getElementById(
      "sheetOverlay"
    );

  const sheet =
    document.getElementById(
      "sheet"
    );


  /* =========================================
     UTIL
  ========================================= */

  function escapeHtml(value) {
    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function clean(value) {
    return String(
      value ?? ""
    )
      .replace(/\s+/g, " ")
      .trim();
  }


  function normalizeTitle(value) {
    return clean(value)
      .toLowerCase()
      .replace(
        /[ 　「」『』【】・！!？?：:〜～]/g,
        ""
      );
  }


  function normalizeVenue(value) {
    return clean(value)
      .toLowerCase()
      .replace(/[ 　]/g, "");
  }


  function readStorageArray(key) {
    try {
      const value =
        JSON.parse(
          localStorage.getItem(
            key
          ) || "[]"
        );

      return Array.isArray(value)
        ? value
        : [];

    } catch {
      return [];
    }
  }


  function saveFavorites() {
    localStorage.setItem(
      FAVORITES_KEY,
      JSON.stringify(
        [...favorites]
      )
    );
  }


  function saveVisible() {
    localStorage.setItem(
      VISIBLE_KEY,
      JSON.stringify(
        [...visiblePerformers]
      )
    );
  }


  function formatDateKey(date) {
    const y =
      date.getFullYear();

    const m =
      String(
        date.getMonth() + 1
      ).padStart(2, "0");

    const d =
      String(
        date.getDate()
      ).padStart(2, "0");

    return `${y}-${m}-${d}`;
  }


  function parseDateKey(value) {
    const match =
      /^(\d{4})-(\d{2})-(\d{2})$/
        .exec(value);

    if (!match) {
      return null;
    }

    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3])
    );
  }


  function getPerformer(id) {
    return performerMap[id] || {
      id,
      name: id,
      color: "#8993a3",
      short: String(id)
        .slice(0, 1),
    };
  }


  function sourceLabel(source) {
    const map = {
      fany: "FANY",
      tiget: "TIGET",
      eplus: "イープラス",
      livepocket: "LivePocket",
      theater: "劇場公式",
    };

    return map[source]
      || String(source || "").toUpperCase();
  }


  function unique(values) {
    return [
      ...new Set(
        values.filter(Boolean)
      )
    ];
  }


  /* =========================================
     データ読み込み
  ========================================= */

  async function loadData() {

    try {
      const response =
        await fetch(
          `events.json?t=${Date.now()}`,
          {
            cache: "no-store",
          }
        );

      if (!response.ok) {
        throw new Error(
          `events.json ${response.status}`
        );
      }

      const data =
        await response.json();

      rawEvents =
        Array.isArray(data)
          ? data
          : (
              Array.isArray(data.events)
                ? data.events
                : []
            );

      const configPerformers =
        Array.isArray(data.performers)
          ? data.performers
          : [];

      performers =
        DEFAULT_PERFORMERS.map(
          fallback => {

            const found =
              configPerformers.find(
                item =>
                  item.id ===
                  fallback.id
              );

            return {
              ...fallback,
              ...(found || {}),
              short:
                fallback.short,
            };
          }
        );

      performerMap =
        Object.fromEntries(
          performers.map(
            performer => [
              performer.id,
              performer,
            ]
          )
        );

      if (
        visiblePerformers.size === 0
      ) {
        visiblePerformers =
          new Set(
            performers.map(
              performer =>
                performer.id
            )
          );

        saveVisible();
      }

      groups =
        buildGroups(
          rawEvents
        );

      renderAll();

    } catch (error) {

      console.error(error);

      daySection.innerHTML = `
        <div class="empty-message">
          events.json の読み込みに失敗しました。
        </div>
      `;
    }
  }


  /* =========================================
     公演をまとめる
  ========================================= */

  function calendarKey(event) {
    return [
      event.date || "",
      event.startTime || "",
      normalizeTitle(
        event.title
      ),
      normalizeVenue(
        event.venue
      ),
    ].join("|");
  }


  function buildGroups(events) {

    const map =
      new Map();

    events.forEach(
      event => {

        const key =
          calendarKey(event);

        if (!map.has(key)) {

          map.set(
            key,
            {
              key,
              date:
                event.date || "",
              openTime:
                event.openTime || "",
              startTime:
                event.startTime || "",
              title:
                event.title ||
                "公演名不明",
              venue:
                event.venue || "",
              trackedPerformers:
                [],
              performersText:
                [],
              records:
                [],
              newUntil:
                "",
            }
          );
        }

        const group =
          map.get(key);

        group.records.push(
          event
        );

        const tracked =
          [
            event.performerId,
            ...(
              Array.isArray(
                event.trackedPerformers
              )
                ? event.trackedPerformers
                : []
            ),
          ];

        group.trackedPerformers =
          unique([
            ...group.trackedPerformers,
            ...tracked,
          ]);

        const performerText =
          Array.isArray(
            event.performersText
          )
            ? event.performersText
            : (
                clean(
                  event.performersText
                )
                  ? [
                      clean(
                        event.performersText
                      )
                    ]
                  : []
              );

        group.performersText =
          unique([
            ...group.performersText,
            ...performerText,
          ]);

        if (
          event.newUntil &&
          (
            !group.newUntil ||
            event.newUntil >
            group.newUntil
          )
        ) {
          group.newUntil =
            event.newUntil;
        }

        if (
          !group.openTime &&
          event.openTime
        ) {
          group.openTime =
            event.openTime;
        }

        if (
          !group.venue &&
          event.venue
        ) {
          group.venue =
            event.venue;
        }
      }
    );

    return [
      ...map.values()
    ].sort(
      (a, b) =>
        (
          a.date +
          a.startTime
        ).localeCompare(
          b.date +
          b.startTime
        )
    );
  }


  function visibleGroups() {
    return groups.filter(
      group =>
        group.trackedPerformers
          .some(
            id =>
              visiblePerformers.has(
                id
              )
          )
    );
  }


  /* =========================================
     HEADER / LEGEND
  ========================================= */

  function renderLegend() {

    legend.innerHTML =
      performers
        .filter(
          performer =>
            visiblePerformers.has(
              performer.id
            )
        )
        .map(
          performer => `
            <div class="legend-item">
              <span
                class="legend-dot"
                style="
                  background:
                  ${escapeHtml(
                    performer.color
                  )}
                "
              ></span>

              ${escapeHtml(
                performer.name
              )}
            </div>
          `
        )
        .join("")
      +
      `
        <div class="legend-help">
          色で出演者がわかります
        </div>
      `;
  }


  /* =========================================
     CALENDAR
  ========================================= */

  function renderCalendar() {

    monthTitle.textContent =
      `${currentMonth.getFullYear()}年`
      +
      `${currentMonth.getMonth() + 1}月`;

    const year =
      currentMonth.getFullYear();

    const month =
      currentMonth.getMonth();

    const firstDay =
      new Date(
        year,
        month,
        1
      );

    const lastDay =
      new Date(
        year,
        month + 1,
        0
      );

    /*
      JS:
      日=0 月=1...
      カレンダー:
      月始まり
    */
    const mondayOffset =
      (
        firstDay.getDay() + 6
      ) % 7;

    const totalCells =
      Math.ceil(
        (
          mondayOffset
          +
          lastDay.getDate()
        )
        / 7
      ) * 7;

    const startDate =
      new Date(
        year,
        month,
        1 - mondayOffset
      );

    const dayMap =
      buildDayMap();

    let html = "";

    for (
      let i = 0;
      i < totalCells;
      i++
    ) {

      const date =
        new Date(
          startDate
        );

      date.setDate(
        startDate.getDate() + i
      );

      const key =
        formatDateKey(date);

      const isOther =
        date.getMonth() !== month;

      const isSelected =
        key === selectedDate;

      const dayData =
        dayMap.get(key)
        || {
          groups: [],
          performerCounts: {},
        };

      const countsHtml =
        performers
          .filter(
            performer =>
              visiblePerformers.has(
                performer.id
              )
          )
          .map(
            performer => {

              const count =
                dayData
                  .performerCounts[
                    performer.id
                  ] || 0;

              if (!count) {
                return "";
              }

              return `
                <div class="performer-count">

                  <span
                    class="mini-badge"
                    style="
                      background:
                      ${escapeHtml(
                        performer.color
                      )}
                    "
                  >
                    ${escapeHtml(
                      performer.short
                    )}
                  </span>

                  <span>
                    ${count}
                  </span>

                </div>
              `;
            }
          )
          .join("");

      html += `
        <div
          class="
            day-cell
            ${isOther
              ? "other-month"
              : ""}
            ${isSelected
              ? "selected"
              : ""}
          "
          data-date="${key}"
        >

          <div class="day-number">
            ${date.getDate()}
          </div>

          <div class="performer-counts">
            ${countsHtml}
          </div>

          ${
            dayData.groups.length
              ? `
                <div class="day-total">
                  ${dayData.groups.length}件
                </div>
              `
              : ""
          }

        </div>
      `;
    }

    calendarGrid.innerHTML =
      html;

    calendarGrid
      .querySelectorAll(
        ".day-cell"
      )
      .forEach(
        cell => {

          cell.addEventListener(
            "click",
            () => {

              const key =
                cell.dataset.date;

              const date =
                parseDateKey(key);

              if (!date) {
                return;
              }

              if (
                date.getMonth()
                !==
                currentMonth.getMonth()
                ||
                date.getFullYear()
                !==
                currentMonth.getFullYear()
              ) {
                currentMonth =
                  new Date(
                    date.getFullYear(),
                    date.getMonth(),
                    1
                  );
              }

              selectedDate =
                key;

              dayExpanded =
                false;

              renderCalendar();
              renderSelectedDay();

              window.scrollTo({
                top:
                  document
                    .getElementById(
                      "daySection"
                    )
                    .offsetTop
                  - 15,
                behavior:
                  "smooth",
              });
            }
          );
        }
      );
  }


  function buildDayMap() {

    const map =
      new Map();

    visibleGroups()
      .forEach(
        group => {

          if (!map.has(group.date)) {
            map.set(
              group.date,
              {
                groups: [],
                performerCounts: {},
              }
            );
          }

          const item =
            map.get(group.date);

          item.groups.push(
            group
          );

          group.trackedPerformers
            .forEach(
              id => {

                if (
                  !visiblePerformers.has(id)
                ) {
                  return;
                }

                item
                  .performerCounts[id] =
                  (
                    item
                      .performerCounts[id]
                    || 0
                  ) + 1;
              }
            );
        }
      );

    return map;
  }


  /* =========================================
     SELECTED DAY
  ========================================= */

  function renderSelectedDay() {

    const date =
      parseDateKey(
        selectedDate
      );

    if (!date) {
      return;
    }

    const dayGroups =
      visibleGroups()
        .filter(
          group =>
            group.date ===
            selectedDate
        );

    const title =
      `${date.getMonth() + 1}月`
      +
      `${date.getDate()}日`
      +
      `（${WEEKDAYS[
        date.getDay()
      ]}）`;

    if (
      dayGroups.length === 0
    ) {

      daySection.innerHTML = `
        <div class="day-section-head">

          <h2 class="day-section-title">
            ${title}
          </h2>

          <div class="day-section-count">
            0件のライブ
          </div>

        </div>

        <div class="empty-message">
          この日のライブはありません。
        </div>
      `;

      return;
    }

    const shown =
      dayExpanded
        ? dayGroups
        : dayGroups.slice(0, 4);

    daySection.innerHTML = `
      <div class="day-section-head">

        <h2 class="day-section-title">
          ${title}
        </h2>

        <div class="day-section-count">
          ${dayGroups.length}件のライブ
        </div>

        <div class="selected-label">
          この日を選択中
        </div>

      </div>

      <div class="event-list">

        ${shown
          .map(
            renderEventRow
          )
          .join("")}

      </div>

      ${
        dayGroups.length > 4
          ? `
            <button
              id="viewAllDay"
              class="view-all-button"
            >
              ${
                dayExpanded
                  ? "表示を戻す"
                  :
                  `${date.getMonth() + 1}月`
                  +
                  `${date.getDate()}日の`
                  +
                  `すべてのライブを見る`
                  +
                  `（${dayGroups.length}件） ›`
              }
            </button>
          `
          : `
            <button
              class="view-all-button"
              disabled
            >
              ${date.getMonth() + 1}月
              ${date.getDate()}日の
              すべてのライブ
              （${dayGroups.length}件）
            </button>
          `
      }
    `;

    bindEventRows(
      daySection
    );

    const viewAllButton =
      document.getElementById(
        "viewAllDay"
      );

    if (viewAllButton) {

      viewAllButton.addEventListener(
        "click",
        () => {
          dayExpanded =
            !dayExpanded;

          renderSelectedDay();
        }
      );
    }
  }


  function renderEventRow(group) {

    const performerBadges =
      performers
        .filter(
          performer =>
            group
              .trackedPerformers
              .includes(
                performer.id
              )
            &&
            visiblePerformers.has(
              performer.id
            )
        )
        .map(
          performer => `
            <span
              class="mini-badge"
              style="
                background:
                ${escapeHtml(
                  performer.color
                )}
              "
            >
              ${escapeHtml(
                performer.short
              )}
            </span>
          `
        )
        .join("");

    return `
      <button
        class="event-row"
        data-event-key="${escapeHtml(
          group.key
        )}"
      >

        <div class="event-time">
          ${escapeHtml(
            group.startTime || "--:--"
          )}
        </div>

        <div class="event-badges">
          ${performerBadges}
        </div>

        <div class="event-main">

          <div class="event-title">
            ${escapeHtml(
              group.title
            )}
          </div>

          <div class="event-venue">
            📍
            ${escapeHtml(
              group.venue ||
              "会場情報なし"
            )}
          </div>

        </div>

        <div class="event-arrow">
          ›
        </div>

      </button>
    `;
  }


  function bindEventRows(container) {

    container
      .querySelectorAll(
        "[data-event-key]"
      )
      .forEach(
        element => {

          element.addEventListener(
            "click",
            () => {

              const group =
                groups.find(
                  item =>
                    item.key ===
                    element.dataset
                      .eventKey
                );

              if (group) {
                openEventSheet(
                  group
                );
              }
            }
          );
        }
      );
  }


  /* =========================================
     EVENT DETAIL
  ========================================= */

  function openEventSheet(group) {

    const sourceRecords =
      uniqueRecordsBySource(
        group.records
      );

    const ticketOptions =
      getGroupTicketOptions(
        group
      );

    const trackedHtml =
      performers
        .filter(
          performer =>
            group
              .trackedPerformers
              .includes(
                performer.id
              )
        )
        .map(
          performer => `
            <span
              class="performer-pill"
              style="
                background:
                ${escapeHtml(
                  performer.color
                )}
              "
            >
              ${escapeHtml(
                performer.name
              )}
            </span>
          `
        )
        .join(" ");

    const performerDetails =
      group.performersText
        .length
        ? group.performersText
            .map(
              text =>
                `<div>${escapeHtml(
                  text
                )}</div>`
            )
            .join("")
        : "出演者詳細なし";

    const ticketHtml =
      ticketOptions.length
        ? ticketOptions
            .map(
              option => `
                <div class="ticket-option">

                  <strong>
                    ${escapeHtml(
                      option.name ||
                      option.type ||
                      "チケット"
                    )}
                  </strong>

                  ${
                    option.type
                      ? `
                        <div>
                          ${escapeHtml(
                            option.type
                          )}
                        </div>
                      `
                      : ""
                  }

                  ${
                    option.price
                      ? `
                        <div>
                          ${escapeHtml(
                            option.price
                          )}
                        </div>
                      `
                      : ""
                  }

                  ${
                    option.status
                      ? `
                        <div style="
                          margin-top:5px
                        ">
                          <span
                            class="status-pill"
                          >
                            ${escapeHtml(
                              option.status
                            )}
                          </span>
                        </div>
                      `
                      : ""
                  }

                </div>
              `
            )
            .join("")
        : `
            <div class="content-card-sub">
              チケット詳細情報はありません。
            </div>
          `;

    const sourceLinks =
      sourceRecords
        .filter(
          record =>
            record.sourceUrl
        )
        .map(
          record => `
            <a
              class="source-link"
              href="${escapeHtml(
                record.sourceUrl
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(
                sourceLabel(
                  record.source
                )
              )}で見る ↗
            </a>
          `
        )
        .join("");

    const isFavorite =
      favorites.has(
        group.key
      );

    sheet.innerHTML = `
      <div class="sheet-handle"></div>

      <button
        id="sheetClose"
        class="sheet-close"
      >
        ×
      </button>

      <div class="sheet-title">
        ${escapeHtml(
          group.title
        )}
      </div>

      <div class="sheet-meta">

        📅 ${escapeHtml(
          group.date
        )}

        <br>

        ⏰
        ${
          group.openTime
            ? `開場 ${escapeHtml(

  function uniqueRecordsBySource(
    records
  ) {

    const seen =
      new Set();

    return records.filter(
      record => {

        const key =
          [
            record.source,
            record.sourceUrl,
          ].join("|");

        if (seen.has(key)) {
          return false;
        }

        seen.add(key);
        return true;
      }
    );
  }


  function getGroupTicketOptions(
    group
  ) {

    const result = [];
    const seen = new Set();

    group.records.forEach(
      record => {

        const options =
          Array.isArray(
            record.ticketOptions
          )
            ? record.ticketOptions
            : [];

        options.forEach(
          option => {

            const key = [
              record.source,
              option.name,
              option.type,
              option.price,
              option.status,
            ].join("|");

            if (seen.has(key)) {
              return;
            }

            seen.add(key);

            result.push({
              ...option,
              source:
                record.source,
            });
          }
        );
      }
    );

    return result;
  }

  function getSaleItems() {

    const result = [];
    const seen = new Set();

    groups.forEach(
      group => {

        group.records.forEach(
          record => {

            let options =
              Array.isArray(
                record.ticketOptions
              )
                ? record.ticketOptions
                : [];

            /*
              TIGET等で券種がなく
              公演レベルsalePeriodsだけある場合
            */
            if (
              options.length === 0
              &&
              Array.isArray(
                record.salePeriods
              )
              &&
              record.salePeriods.length
            ) {

              options = [
                {
                  name: "チケット",
                  type: "",
                  status:
                    record.ticketStatus
                    || "",
                  price: "",
                  salePeriods:
                    record.salePeriods,
                }
              ];
            }

            options.forEach(
              option => {

                const periods =
                  Array.isArray(
                    option.salePeriods
                  )
                    &&
                    option.salePeriods
                      .length
                    ? option.salePeriods
                    : (
                        option.saleStartAt
                          ? [
                              {
                                category:
                                  option.saleCategory
                                  || "",
                                label:
                                  option.saleLabel
                                  || "",
                                startAt:
                                  option.saleStartAt
                                  || "",
                                endAt:
                                  option.saleEndAt
                                  || "",
                              }
                            ]
                          : []
                      );

                periods.forEach(
                  period => {

                    if (
                      !period.startAt
                    ) {
                      return;
                    }

                    const key = [
                      group.key,
                      record.source,
                      option.name,
                      option.type,
                      period.category,
                      period.startAt,
                    ].join("|");

                    if (seen.has(key)) {
                      return;
                    }

                    seen.add(key);

                    result.push({
                      group,
                      record,
                      option,
                      period,
                    });
                  }
                );
              }
            );
          }
        );
      }
    );

    return result;
  }


  function getSaleGroups() {

    const now =
      new Date();

    const nearEnd =
      new Date(
        now.getTime()
        +
        SALE_NEAR_DAYS
        * 24 * 60 * 60 * 1000
      );

    const startedCutoff =
      new Date(
        now.getTime()
        -
        SALE_STARTED_DAYS
        * 24 * 60 * 60 * 1000
      );

    const advance = [];
    const firstCome = [];
    const started = [];

    getSaleItems()
      .forEach(
        item => {

          const category =
            item.period.category;

          const start =
            new Date(
              item.period.startAt
            );

          const end =
            item.period.endAt
              ? new Date(
                  item.period.endAt
                )
              : null;

          if (
            Number.isNaN(
              start.getTime()
            )
          ) {
            return;
          }

          /*
            先行販売は、
            終了日時が分かるものだけ
            受付期間中に表示。
          */
          if (
            category === "advance"
            &&
            end
            &&
            start <= now
            &&
            now <= end
          ) {
            advance.push(
              item
            );

            return;
          }

          /*
            先着販売
            開始前7日以内
          */
          if (
            category === "first_come"
            &&
            start > now
            &&
            start <= nearEnd
          ) {
            firstCome.push(
              item
            );

            return;
          }

          /*
            先着販売開始後5日
          */
          if (
            category === "first_come"
            &&
            start <= now
            &&
            start >= startedCutoff
          ) {
            started.push(
              item
            );
          }
        }
      );

    advance.sort(
      (a, b) =>
        Date.parse(
          a.period.endAt
        )
        -
        Date.parse(
          b.period.endAt
        )
    );

    firstCome.sort(
      (a, b) =>
        Date.parse(
          a.period.startAt
        )
        -
        Date.parse(
          b.period.startAt
        )
    );

    started.sort(
      (a, b) =>
        Date.parse(
          b.period.startAt
        )
        -
        Date.parse(
          a.period.startAt
        )
    );

    return {
      advance,
      firstCome,
      started,
    };
  }

        clean(

        results.innerHTML = `

            検索ワードを入力してください。

                group
                  .trackedPerformers
                  .map(
                    id =>
                      getPerformer(id)

                  .join(" ");

              const haystack = [
                group.title,
                group.venue,
                trackedNames,
                ...group.performersText,
              ]
                .join(" ")
                .toLowerCase();

              return haystack.includes(
                q

            }
          );

      results.innerHTML =

        currentMonth =
          new Date(
            currentMonth
              .getFullYear(),
            currentMonth
              .getMonth() - 1,
            1
          );

        selectedDate =
          formatDateKey(
            currentMonth
          );

        dayExpanded =
          false;

        renderCalendar();
        renderSelectedDay();
      }
    );

  document
    .getElementById(
      "nextMonth"
    )
    .addEventListener(
      "click",
      () => {

        currentMonth =
          new Date(
            currentMonth
              .getFullYear(),
            currentMonth
              .getMonth() + 1,
            1
          );

        selectedDate =
          formatDateKey(
            currentMonth
          );

        dayExpanded =
          false;

        renderCalendar();
        renderSelectedDay();
      }
    );

  sheetOverlay.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        sheetOverlay
      ) {
        closeSheet();
      }
    }
  );

  /*
    Escキー
  */
  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {
        closeDrawer();
        closeSheet();
      }
    }
  );


  /* =========================================
     START
  ========================================= */

  loadData();

})();
</script>

</body>
</html>
