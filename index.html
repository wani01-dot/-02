<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f5f7fa"
  >

  <title>ワラいどっとこむ</title>

  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #111827;
      --sub: #687386;
      --border: #e4e9f0;
      --soft: #f1f4f8;

      --maison: #e74c3c;
      --pyuto: #f4c430;
      --nansui: #3498db;

      --accent: #1f6ed4;

      --shadow:
        0 7px 28px rgba(20, 32, 54, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;

      background:
        linear-gradient(
          180deg,
          #fafbfd 0,
          #f3f5f8 100%
        );

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;

      padding:
        calc(18px + env(safe-area-inset-top))
        12px
        calc(40px + env(safe-area-inset-bottom));
    }

    /* ========================================
       HEADER
    ======================================== */

    .app-header {
      display: flex;
      align-items: center;
      gap: 11px;

      padding:
        2px
        10px
        15px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
    }

    .brand-text {
      flex: 1;
      min-width: 0;
    }

    .brand-title {
      margin: 0;

      font-size:
        clamp(
          25px,
          7vw,
          35px
        );

      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.04em;

      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 5px;

      color: #5f6c80;

      font-size: 14px;
      font-weight: 700;
    }

    .menu-button {
      width: 47px;
      height: 47px;

      border: 0;
      border-radius: 50%;

      background: transparent;

      color: #1f2937;

      font-size: 32px;
      line-height: 1;

      cursor: pointer;
    }

    /* ========================================
       PERFORMER FILTER
    ======================================== */

    .legend {
      display: flex;
      align-items: center;
      gap: 7px;

      overflow-x: auto;

      padding:
        11px
        10px;

      margin-bottom: 14px;

      border:
        1px solid
        #edf0f4;

      border-radius: 15px;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      box-shadow:
        var(--shadow);

      scrollbar-width: none;
    }

    .legend::-webkit-scrollbar {
      display: none;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

      flex: 0 0 auto;

      min-height: 39px;

      padding:
        6px
        10px;

      border:
        2px solid
        transparent;

      border-radius: 999px;

      background: transparent;

      color: #111827;

      font-size: 14px;
      font-weight: 900;

      white-space: nowrap;

      cursor: pointer;

      transition:
        opacity 0.15s,
        background 0.15s,
        border-color 0.15s,
        transform 0.1s;
    }

    .legend-item:active {
      transform: scale(0.96);
    }

    /*
      選択中
    */
    .legend-item.filter-selected {
      border-color: #cddff5;
      background: #edf5ff;
      opacity: 1;
    }

    /*
      他の芸人が選択中
    */
    .legend-item.filter-dimmed {
      opacity: 0.38;
    }

    .legend-dot {
      width: 20px;
      height: 20px;

      border-radius: 50%;

      flex:
        0
        0
        20px;
    }

    .legend-help {
      flex: 0 0 auto;

      padding-left: 10px;

      border-left:
        1px solid
        var(--border);

      color: #697588;

      white-space: nowrap;

      font-size: 11px;
      font-weight: 700;
    }

    .legend-help.filtering {
      color: #2873c5;
      font-weight: 900;
    }

    /* ========================================
       SURFACE
    ======================================== */

    .surface {
      border:
        1px solid
        #edf0f4;

      border-radius: 22px;

      background:
        rgba(
          255,
          255,
          255,
          0.97
        );

      box-shadow:
        var(--shadow);
    }

    /* ========================================
       CALENDAR
    ======================================== */

    .calendar-card {
      padding:
        10px
        6px
        8px;
    }

    .month-header {
      display: grid;

      grid-template-columns:
        50px
        1fr
        50px;

      align-items: center;

      padding:
        2px
        5px
        10px;
    }

    .month-title {
      text-align: center;

      font-size:
        clamp(
          25px,
          7vw,
          34px
        );

      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .month-button {
      width: 47px;
      height: 47px;

      border: 0;
      border-radius: 50%;

      background: #f3f5f8;

      color: #132033;

      font-size: 34px;
      line-height: 1;

      cursor: pointer;
    }

    .week-row,
    .calendar-grid {
      display: grid;

      grid-template-columns:
        repeat(
          7,
          minmax(0, 1fr)
        );
    }

    .week-row {
      padding: 0 1px;
    }

    .weekday {
      padding:
        7px
        0
        10px;

      text-align: center;

      color: #526075;

      font-size: 13px;
      font-weight: 800;
    }

    .calendar-grid {
      overflow: hidden;

      border-top:
        1px solid
        var(--border);

      border-left:
        1px solid
        var(--border);

      border-radius: 12px;
    }

    .day-cell {
      position: relative;

      min-width: 0;
      min-height: 94px;

      overflow: hidden;

      padding:
        6px
        4px
        5px;

      border-right:
        1px solid
        var(--border);

      border-bottom:
        1px solid
        var(--border);

      background: #fff;

      cursor: pointer;
    }

    .day-cell.other-month {
      background: #fafbfc;
      color: #b9c0ca;
    }

    .day-cell.selected {
      z-index: 1;

      background:
        linear-gradient(
          135deg,
          #fff7f6,
          #fffafa
        );

      box-shadow:
        inset
        0
        0
        0
        1.5px
        #ffb7b2;
    }

    .day-number {
      min-height: 22px;

      font-size: 17px;
      line-height: 1;

      font-weight: 900;
    }

    .day-cell.selected
    .day-number {
      color: #cf251d;
    }

    /* ========================================
       め / ピ / 軟
    ======================================== */

    .performer-counts {
      display: flex;
      flex-direction: column;
      align-items: flex-start;

      gap: 2px;

      margin-top: 3px;
    }

    .performer-count {
      display: flex;
      align-items: center;

      gap: 3px;

      min-width: 0;

      font-size: 11px;
      font-weight: 900;
      line-height: 1;
    }

    .mini-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 22px;
      height: 22px;

      flex:
        0
        0
        22px;

      border-radius: 50%;

      color: #fff;

      font-size: 10px;
      font-weight: 900;
      line-height: 1;
    }

    .day-total {
      position: absolute;

      right: 5px;
      bottom: 5px;

      color: #68758a;

      font-size: 10px;
      font-weight: 800;
    }

    /* ========================================
       DAY EVENTS
    ======================================== */

    .day-section {
      margin-top: 14px;

      padding:
        15px
        9px
        11px;
    }

    .day-section-head {
      display: flex;
      align-items: center;
      gap: 9px;

      padding:
        0
        4px
        12px;
    }

    .day-section-title {
      margin: 0;

      font-size:
        clamp(
          22px,
          6vw,
          31px
        );

      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.035em;
    }

    .day-section-count {
      color: #657286;

      font-size: 13px;
      font-weight: 700;
    }

    .selected-label {
      margin-left: auto;

      padding:
        8px
        11px;

      border-radius: 999px;

      background: #fff0ef;

      color: #ec4c43;

      font-size: 11px;
      font-weight: 900;

      white-space: nowrap;
    }

    .event-list {
      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius: 13px;

      background: #fff;
    }

    .event-row {
      display: grid;

      grid-template-columns:
        63px
        auto
        1fr
        21px;

      align-items: center;

      gap: 6px;

      min-height: 64px;

      width: 100%;

      padding:
        8px
        7px;

      border: 0;

      border-bottom:
        1px solid
        var(--border);

      background: #fff;

      color: var(--text);

      text-align: left;

      cursor: pointer;
    }

    .event-row:last-child {
      border-bottom: 0;
    }

    .event-time {
      padding-left: 3px;

      font-size: 15px;
      font-weight: 900;

      white-space: nowrap;
    }

    .event-badges {
      display: flex;
      align-items: center;

      gap: 3px;

      flex-wrap: wrap;

      max-width: 57px;
    }

    .event-badges
    .mini-badge {
      width: 25px;
      height: 25px;

      flex-basis: 25px;

      font-size: 11px;
    }

    .event-main {
      min-width: 0;
    }

    .event-title {
      overflow: hidden;

      margin-bottom: 3px;

      font-size: 13px;
      font-weight: 900;

      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .event-venue {
      overflow: hidden;

      color: #6f7b8e;

      font-size: 11px;
      font-weight: 600;

      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .event-arrow {
      color: #758195;

      font-size: 25px;
      font-weight: 300;
    }

    .view-all-button {
      display: block;

      width: 100%;

      margin-top: 12px;

      padding:
        14px
        10px;

      border: 0;

      border-radius: 999px;

      background: #f2f4f7;

      color: #172033;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;
    }

    .empty-message {
      padding:
        27px
        15px;

      text-align: center;

      color: #7c8797;

      font-weight: 700;
    }

    /* ========================================
       DRAWER
    ======================================== */

    .drawer-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;

      visibility: hidden;

      background:
        rgba(
          15,
          23,
          42,
          0
        );

      transition:
        background 0.2s,
        visibility 0.2s;
    }

    .drawer-overlay.open {
      visibility: visible;

      background:
        rgba(
          15,
          23,
          42,
          0.42
        );
    }

    .drawer {
      position: absolute;

      top: 0;
      left: 0;

      width:
        min(
          82vw,
          390px
        );

      height: 100%;

      overflow-y: auto;

      padding:
        calc(
          20px
          +
          env(
            safe-area-inset-top
          )
        )
        17px
        calc(
          25px
          +
          env(
            safe-area-inset-bottom
          )
        );

      background: #fff;

      transform:
        translateX(
          -102%
        );

      transition:
        transform
        0.23s
        ease;

      box-shadow:
        15px
        0
        40px
        rgba(
          15,
          23,
          42,
          0.15
        );
    }

    .drawer-overlay.open
    .drawer {
      transform:
        translateX(0);
    }

    .drawer-close {
      width: 43px;
      height: 43px;

      border: 0;
      border-radius: 50%;

      background: #f3f5f7;

      font-size: 25px;

      cursor: pointer;
    }

    .drawer-title {
      margin:
        18px
        6px
        2px;

      font-size: 25px;
      font-weight: 900;
    }

    .drawer-subtitle {
      margin:
        0
        6px
        18px;

      color: #6c788b;

      font-size: 13px;
      font-weight: 700;
    }

    .drawer-menu {
      display: grid;
      gap: 5px;
    }

    .drawer-item {
      display: flex;
      align-items: center;

      gap: 12px;

      width: 100%;

      padding:
        13px
        12px;

      border: 0;

      border-radius: 12px;

      background: transparent;

      color: #1b2535;

      text-align: left;

      font-weight: 800;

      cursor: pointer;
    }

    .drawer-item.active {
      background: #edf5ff;
      color: #1669c9;
    }

    .drawer-icon {
      width: 23px;

      text-align: center;

      font-size: 19px;
    }

    .drawer-badge {
      min-width: 24px;

      margin-left: auto;

      padding:
        3px
        7px;

      border-radius: 999px;

      background: #f35467;

      color: #fff;

      text-align: center;

      font-size: 11px;
      font-weight: 900;
    }

    .drawer-divider {
      height: 1px;

      margin:
        8px
        3px;

      background: var(--border);
    }

    .drawer-version {
      padding:
        20px
        8px
        0;

      color: #9aa3af;

      font-size: 11px;
    }

    /* ========================================
       OTHER PAGES
    ======================================== */

    .page-section {
      display: none;
      padding: 17px;
    }

    .page-section.show {
      display: block;
    }

    .page-title {
      margin:
        0
        0
        16px;

      font-size: 26px;
      font-weight: 900;
    }

    .page-subtitle {
      margin:
        -9px
        0
        17px;

      color: #748094;

      font-size: 13px;
      line-height: 1.6;
    }

    .content-card {
      padding: 14px;

      margin-bottom: 10px;

      border:
        1px solid
        var(--border);

      border-radius: 15px;

      background: #fff;
    }

    .content-card-title {
      margin-bottom: 6px;

      font-size: 15px;
      font-weight: 900;
    }

    .content-card-sub {
      color: #6d798b;

      font-size: 12px;
      line-height: 1.6;
    }

    .search-input {
      width: 100%;

      padding:
        14px
        16px;

      margin-bottom: 15px;

      border:
        1px solid
        var(--border);

      border-radius: 13px;

      outline: none;

      background: #fff;

      font-size: 16px;
    }

    .section-label {
      margin:
        18px
        0
        9px;

      font-size: 18px;
      font-weight: 900;
    }

    .status-pill,
    .performer-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding:
        5px
        9px;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 900;
    }

    .status-pill {
      background: #fff0ef;

      color: #d93f36;
    }

    .performer-pill {
      color: #fff;
    }

    .result-row {
      width: 100%;

      padding: 13px;

      margin-bottom: 8px;

      border:
        1px solid
        var(--border);

      border-radius: 13px;

      background: #fff;

      text-align: left;

      cursor: pointer;
    }

    .result-date {
      margin-bottom: 4px;

      color: #667286;

      font-size: 12px;
      font-weight: 800;
    }

    .result-title {
      font-size: 15px;
      font-weight: 900;
    }

    .result-sub {
      margin-top: 4px;

      color: #758094;

      font-size: 12px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding:
        15px
        3px;

      border-bottom:
        1px solid
        var(--border);
    }

    .settings-row:last-child {
      border-bottom: 0;
    }

    .toggle {
      position: relative;

      width: 52px;
      height: 31px;

      border: 0;
      border-radius: 999px;

      background: #d7dce3;

      cursor: pointer;
    }

    .toggle::after {
      position: absolute;

      top: 3px;
      left: 3px;

      width: 25px;
      height: 25px;

      border-radius: 50%;

      background: #fff;

      content: "";

      box-shadow:
        0
        2px
        5px
        rgba(
          0,
          0,
          0,
          0.15
        );

      transition: 0.18s;
    }

    .toggle.on {
      background: #3183df;
    }

    .toggle.on::after {
      left: 24px;
    }

    /* ========================================
       DETAIL SHEET
    ======================================== */

    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;

      display: none;

      align-items: flex-end;
      justify-content: center;

      overflow: hidden;

      background:
        rgba(
          15,
          23,
          42,
          0.44
        );

      /*
        overlay自身ではスクロールさせない。
        中のsheetだけ上下操作を許可。
      */
      touch-action: none;
    }

    .sheet-overlay.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 760px;

      /*
        iPhoneでアドレスバーが動いても
        詳細画面側でスクロールできるようにする
      */
      max-height: 88dvh;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        22px
        18px
        calc(
          28px
          +
          env(
            safe-area-inset-bottom
          )
        );

      border-radius:
        25px
        25px
        0
        0;

      background: #fff;

      box-shadow:
        0
        -15px
        50px
        rgba(
          15,
          23,
          42,
          0.14
        );

      /*
        iPhone Safari対策
      */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }

    .sheet-handle {
      width: 48px;
      height: 5px;

      margin:
        -8px
        auto
        17px;

      border-radius: 999px;

      background: #cdd3db;
    }

    .sheet-close {
      float: right;

      width: 41px;
      height: 41px;

      border: 0;
      border-radius: 50%;

      background: #f1f3f6;

      font-size: 23px;

      cursor: pointer;
    }

    .sheet-title {
      clear: none;

      padding-right: 50px;

      font-size: 24px;
      line-height: 1.35;
      font-weight: 900;
    }

    .sheet-meta {
      margin-top: 11px;

      color: #606d80;

      font-size: 14px;
      line-height: 1.8;
    }

    .sheet-block {
      margin-top: 20px;

      padding-top: 17px;

      border-top:
        1px solid
        var(--border);
    }

    .sheet-block-title {
      margin-bottom: 9px;

      font-size: 16px;
      font-weight: 900;
    }

    .performer-text-compact {
      color: #596579;

      font-size: 15px;
      line-height: 1.65;

      word-break: break-word;
    }

    .ticket-option {
      padding: 11px;

      margin-bottom: 8px;

      border-radius: 12px;

      background: #f7f8fa;
    }

    .source-link {
      display: block;

      margin-top: 8px;

      padding: 12px;

      border-radius: 11px;

      background: #edf5ff;

      color: #176ac7;

      text-decoration: none;

      font-weight: 900;
    }

    .favorite-button {
      width: 100%;

      padding: 14px;

      margin-top: 18px;

      border:
        1px solid
        #e2e6ec;

      border-radius: 999px;

      background: #fff;

      color: #1b2535;

      font-weight: 900;

      cursor: pointer;
    }

    .favorite-button.active {
      border-color: #ffd56a;

      background: #fff8dd;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 520px) {

      .app {
        padding-left: 7px;
        padding-right: 7px;
      }

      .legend {
        gap: 3px;

        padding:
          9px
          6px;
      }

      .legend-item {
        gap: 5px;

        min-height: 35px;

        padding:
          5px
          7px;

        font-size: 12px;
      }

      .legend-dot {
        width: 17px;
        height: 17px;

        flex-basis: 17px;
      }

      .legend-help {
        display: none;
      }

      .calendar-card {
        padding-left: 3px;
        padding-right: 3px;
      }

      .day-cell {
        min-height: 88px;

        padding:
          5px
          3px
          4px;
      }

      .day-number {
        min-height: 20px;

        font-size: 15px;
      }

      .performer-counts {
        gap: 2px;
      }

      .performer-count {
        gap: 2px;

        font-size: 10px;
      }

      .mini-badge {
        width: 20px;
        height: 20px;

        flex-basis: 20px;

        font-size: 9px;
      }

      .day-total {
        right: 4px;
        bottom: 4px;

        font-size: 9px;
      }

      .event-row {
        grid-template-columns:
          58px
          auto
          1fr
          18px;

        gap: 4px;

        min-height: 61px;

        padding:

<script>

(() => {

  /* =========================================
     CONFIG
  ========================================= */

  const DEFAULT_PERFORMERS = [
    {
      id: "maison",
      name: "めぞん",
      color: "#E74C3C",
      short: "め",
    },
    {
      id: "pyuto",
      name: "ピュート",
      color: "#F4C430",
      short: "ピ",
    },
    {
      id: "nansui",
      name: "軟水",
      color: "#3498DB",
      short: "軟",
    },
  ];


  const WEEKDAYS = [
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土",
  ];


  const FAVORITES_KEY =
    "warai-dot-com-favorites";


  const VISIBLE_KEY =
    "warai-dot-com-visible-performers";


  const SALE_NEAR_DAYS = 7;

  const SALE_STARTED_DAYS = 5;


  let rawEvents = [];

  let groups = [];

  let performers = [
    ...DEFAULT_PERFORMERS
  ];

  let performerMap = {};


  let favorites =
    new Set(
      readStorageArray(
        FAVORITES_KEY
      )
    );


  let visiblePerformers =
    new Set(
      readStorageArray(
        VISIBLE_KEY
      )
    );


  /*
    上部の出演者フィルター。

    0組選択
    → 全員表示

    1組選択
    → その芸人の出演日

    2組選択
    → どちらかが出演する日

    3組選択
    → 3組いずれかが出演する日
  */
  let activePerformerFilters =
    new Set();


  let currentMonth =
    new Date(
      new Date().getFullYear(),
      new Date().getMonth(),
      1
    );


  let selectedDate =
    formatDateKey(
      new Date()
    );


  let currentPage =
    "calendar";


  let dayExpanded =
    false;


  /*
    公演詳細を開いたときの
    元ページのスクロール位置
  */
  let sheetScrollY = 0;

  let sheetBodyLocked = false;


  /* =========================================
     DOM
  ========================================= */

  const legend =
    document.getElementById(
      "legend"
    );


  const monthTitle =
    document.getElementById(
      "monthTitle"
    );


  const calendarGrid =
    document.getElementById(
      "calendarGrid"
    );


  const daySection =
    document.getElementById(
      "daySection"
    );


  const calendarView =
    document.getElementById(
      "calendarView"
    );


  const pageSection =
    document.getElementById(
      "pageSection"
    );


  const drawerOverlay =
    document.getElementById(
      "drawerOverlay"
    );


  const sheetOverlay =
    document.getElementById(
      "sheetOverlay"
    );


  const sheet =
    document.getElementById(
      "sheet"
    );


  /* =========================================
     UTIL
  ========================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );
  }


  function clean(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /\s+/g,
        " "
      )
      .trim();
  }


  function normalizeTitle(
    value
  ) {

    return clean(
      value
    )
      .toLowerCase()
      .replace(
        /[ 　「」『』【】・！!？?：:〜～]/g,
        ""
      );
  }


  function normalizeVenue(
    value
  ) {

    return clean(
      value
    )
      .toLowerCase()
      .replace(
        /[ 　]/g,
        ""
      );
  }


  function readStorageArray(
    key
  ) {

    try {

      const value =
        JSON.parse(
          localStorage.getItem(
            key
          )
          ||
          "[]"
        );


      return Array.isArray(
        value
      )
        ?
        value
        :
        [];

    } catch {

      return [];
    }
  }


  function saveFavorites() {

    localStorage.setItem(
      FAVORITES_KEY,
      JSON.stringify(
        [
          ...favorites
        ]
      )
    );
  }


  function saveVisible() {

    localStorage.setItem(
      VISIBLE_KEY,
      JSON.stringify(
        [
          ...visiblePerformers
        ]
      )
    );
  }


  function formatDateKey(
    date
  ) {

    const y =
      date.getFullYear();


    const m =
      String(
        date.getMonth()
        +
        1
      ).padStart(
        2,
        "0"
      );


    const d =
      String(
        date.getDate()
      ).padStart(
        2,
        "0"
      );


    return (
      `${y}-${m}-${d}`
    );
  }


  function parseDateKey(
    value
  ) {

    const match =
      /^(\d{4})-(\d{2})-(\d{2})$/
        .exec(
          value
        );


    if (!match) {
      return null;
    }


    return new Date(
      Number(
        match[1]
      ),

      Number(
        match[2]
      )
      -
      1,

      Number(
        match[3]
      )
    );
  }


  function getPerformer(
    id
  ) {

    return (
      performerMap[id]
      ||
      {
        id,
        name: id,
        color: "#8993a3",
        short:
          String(
            id
          ).slice(
            0,
            1
          ),
      }
    );
  }


  function sourceLabel(
    source
  ) {

    const map = {
      fany:
        "FANY",

      tiget:
        "TIGET",

      eplus:
        "イープラス",

      livepocket:
        "LivePocket",

      theater:
        "劇場公式",
    };


    return (
      map[source]
      ||
      String(
        source
        ||
        ""
      ).toUpperCase()
    );
  }


  function unique(
    values
  ) {

    return [
      ...new Set(
        values.filter(
          Boolean
        )
      )
    ];
  }


  /* =========================================
     DATA
  ========================================= */

  async function loadData() {

    try {

      const response =
        await fetch(
          `events.json?t=${Date.now()}`,
          {
            cache:
              "no-store",
          }
        );


      if (!response.ok) {

        throw new Error(
          `events.json ${response.status}`
        );
      }


      const data =
        await response.json();


      rawEvents =
        Array.isArray(
          data
        )
          ?
          data
          :
          (
            Array.isArray(
              data.events
            )
              ?
              data.events
              :
              []
          );


      const configPerformers =
        Array.isArray(
          data.performers
        )
          ?
          data.performers
          :
          [];


      performers =
        DEFAULT_PERFORMERS.map(
          fallback => {

            const found =
              configPerformers.find(
                item =>
                  item.id
                  ===
                  fallback.id
              );


            return {
              ...fallback,
              ...(found || {}),
              short:
                fallback.short,
            };
          }
        );


      performerMap =
        Object.fromEntries(
          performers.map(
            performer => [
              performer.id,
              performer,
            ]
          )
        );


      if (
        visiblePerformers.size
        ===
        0
      ) {

        visiblePerformers =
          new Set(
            performers.map(
              performer =>
                performer.id
            )
          );


        saveVisible();
      }


      groups =
        buildGroups(
          rawEvents
        );


      renderAll();

    } catch (
      error
    ) {

      console.error(
        error
      );


      daySection.innerHTML = `
        <div class="empty-message">
          events.json の読み込みに失敗しました。
        </div>
      `;
    }
  }


  /* =========================================
     GROUP EVENTS
  ========================================= */

  function calendarKey(
    event
  ) {

    return [
      event.date || "",
      event.startTime || "",
      normalizeTitle(
        event.title
      ),
      normalizeVenue(
        event.venue
      ),
    ].join(
      "|"
    );
  }


  function buildGroups(
    events
  ) {

    const map =
      new Map();


    events.forEach(
      event => {

        const key =
          calendarKey(
            event
          );


        if (
          !map.has(
            key
          )
        ) {

          map.set(
            key,
            {
              key,

              date:
                event.date
                ||
                "",

              openTime:
                event.openTime
                ||
                "",

              startTime:
                event.startTime
                ||
                "",

              title:
                event.title
                ||
                "公演名不明",

              venue:
                event.venue
                ||
                "",

              trackedPerformers:
                [],

              performersText:
                [],

              records:
                [],

              newUntil:
                "",
            }
          );
        }


        const group =
          map.get(
            key
          );


        group.records.push(
          event
        );


        const tracked = [
          event.performerId,

          ...(
            Array.isArray(
              event.trackedPerformers
            )
              ?
              event.trackedPerformers
              :
              []
          ),
        ];


        group.trackedPerformers =
          unique([
            ...group.trackedPerformers,
            ...tracked,
          ]);


        const performerText =
          Array.isArray(
            event.performersText
          )
            ?
            event.performersText
            :
            (
              clean(
                event.performersText
              )
                ?
                [
                  clean(
                    event.performersText
                  )
                ]
                :
                []
            );


        group.performersText =
          unique([
            ...group.performersText,
            ...performerText,
          ]);


        if (
          event.newUntil
          &&
          (
            !group.newUntil
            ||
            event.newUntil
            >
            group.newUntil
          )
        ) {

          group.newUntil =
            event.newUntil;
        }


        if (
          !group.openTime
          &&
          event.openTime
        ) {

          group.openTime =
            event.openTime;
        }


        if (
          !group.venue
          &&
          event.venue
        ) {

          group.venue =
            event.venue;
        }
      }
    );


    return [
      ...map.values()
    ].sort(
      (
        a,
        b
      ) =>
        (
          a.date
          +
          a.startTime
        )
          .localeCompare(
            b.date
            +
            b.startTime
          )
    );
  }


  /*
    複数選択対応。

    activePerformerFiltersが空
    → 全公演

    1人以上選択
    → 選択された芸人のうち
       1組でも出演していれば表示
  */
  function visibleGroups() {

    return groups.filter(
      group => {

        const isVisible =
          group.trackedPerformers
            .some(
              id =>
                visiblePerformers
                  .has(
                    id
                  )
            );


        if (
          !isVisible
        ) {

          return false;
        }


        if (
          activePerformerFilters.size
          >
          0
        ) {

          return (
            group
              .trackedPerformers
              .some(
                id =>
                  activePerformerFilters
                    .has(
                      id
                    )
              )
          );
        }


        return true;
      }
    );
  }


  /* =========================================
     TOP FILTER
  ========================================= */

  function getActiveFilterNames() {

    return performers
      .filter(
        performer =>
          activePerformerFilters
            .has(
              performer.id
            )
      )
      .map(
        performer =>
          performer.name
      );
  }


  function renderLegend() {

    const visible =
      performers.filter(
        performer =>
          visiblePerformers
            .has(
              performer.id
            )
      );


    const selectedNames =
      getActiveFilterNames();


    legend.innerHTML =
      visible.map(
        performer => {

          const selected =
            activePerformerFilters
              .has(
                performer.id
              );


          const dimmed =
            activePerformerFilters.size
            >
            0
            &&
            !selected;


          return `
            <button
              class="
                legend-item
                ${
                  selected
                    ?
                    "filter-selected"
                    :
                    ""
                }
                ${
                  dimmed
                    ?
                    "filter-dimmed"
                    :
                    ""
                }
              "
              data-performer-filter="${escapeHtml(
                performer.id
              )}"
            >

              <span
                class="legend-dot"
                style="
                  background:
                  ${escapeHtml(
                    performer.color
                  )}
                "
              ></span>

              ${escapeHtml(
                performer.name
              )}

            </button>
          `;
        }
      ).join("")
      +
      `
        <div
          class="
            legend-help
            ${
              selectedNames.length
                ?
                "filtering"
                :
                ""
            }
          "
        >
          ${
            selectedNames.length
              ?
              `${escapeHtml(
                selectedNames.join(
                  "＋"
                )
              )}で絞り込み中`
              :
              "名前を押して絞り込み"
          }
        </div>
      `;


    legend
      .querySelectorAll(
        "[data-performer-filter]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const id =
                button.dataset
                  .performerFilter;


              /*
                選択済みなら解除。
                未選択なら追加。
              */
              if (
                activePerformerFilters
                  .has(
                    id
                  )
              ) {

                activePerformerFilters
                  .delete(
                    id
                  );

              } else {

                activePerformerFilters
                  .add(
                    id
                  );
              }


              dayExpanded =
                false;


              renderLegend();

              renderCalendar();

              renderSelectedDay();

              updateDrawerBadges();
            }
          );
        }
      );
  }


  /* =========================================
     CALENDAR
  ========================================= */

  function renderCalendar() {

    monthTitle.textContent =
      `${currentMonth.getFullYear()}年`
      +
      `${currentMonth.getMonth() + 1}月`;


    const year =
      currentMonth.getFullYear();


    const month =
      currentMonth.getMonth();


    const firstDay =
      new Date(
        year,
        month,
        1
      );


    const lastDay =
      new Date(
        year,
        month + 1,
        0
      );


    const mondayOffset =
      (
        firstDay.getDay()
        +
        6
      )
      %
      7;


    const totalCells =
      Math.ceil(
        (
          mondayOffset
          +
          lastDay.getDate()
        )
        /
        7
      )
      *
      7;


    const startDate =
      new Date(
        year,
        month,
        1
        -
        mondayOffset
      );


    const dayMap =
      buildDayMap();


    let html =
      "";


    /*
      フィルター中は選択中の芸人だけ
      カレンダー内の丸を表示する。
    */
    const calendarPerformers =
      performers.filter(
        performer => {

          if (
            !visiblePerformers
              .has(
                performer.id
              )
          ) {

            return false;
          }


          if (
            activePerformerFilters.size
            >
            0
          ) {

            return (
              activePerformerFilters
                .has(
                  performer.id
                )
            );
          }


          return true;
        }
      );


    for (
      let i = 0;
      i < totalCells;
      i++
    ) {

      const date =
        new Date(
          startDate
        );


      date.setDate(
        startDate.getDate()
        +
        i
      );


      const key =
        formatDateKey(
          date
        );


      const isOther =
        date.getMonth()
        !==
        month;


      const isSelected =
        key
        ===
        selectedDate;


      const dayData =
        dayMap.get(
          key
        )
        ||
        {
          groups: [],
          performerCounts: {},
        };


      const countsHtml =
        calendarPerformers
          .map(
            performer => {

              const count =
                dayData
                  .performerCounts[
                    performer.id
                  ]
                ||
                0;


              if (
                !count
              ) {

                return "";
              }


              return `
                <div
                  class="performer-count"
                >

                  <span
                    class="mini-badge"
                    style="
                      background:
                      ${escapeHtml(
                        performer.color
                      )}
                    "
                  >
                    ${escapeHtml(
                      performer.short
                    )}
                  </span>

                  <span>
                    ${count}
                  </span>

                </div>
              `;
            }
          )

              if (
                date.getMonth()
                !==
                currentMonth.getMonth()
                ||
                date.getFullYear()
                !==
                currentMonth.getFullYear()
              ) {

                currentMonth =
                  new Date(

  function buildDayMap() {

    const map =
      new Map();


    visibleGroups()
      .forEach(
        group => {

          if (
            !map.has(
              group.date
            )
          ) {

            map.set(
              group.date,
              {
                groups: [],
                performerCounts: {},
              }
            );
          }


          const item =
            map.get(
              group.date
            );


          item.groups.push(
            group
          );


          group
            .trackedPerformers
            .forEach(
              id => {

                if (
                  !visiblePerformers
                    .has(
                      id
                    )
                ) {

                  return;
                }


                item
                  .performerCounts[
                    id
                  ] =
                  (
                    item
                      .performerCounts[
                        id
                      ]
                    ||
                    0
                  )
                  +
                  1;
              }
            );
        }
      );


    return map;
  }

        .documentElement
        .scrollTop

  function getCompactPerformerText(
    group
  ) {

    const values =
      [];


    group.performersText
      .forEach(
        text => {

          clean(
            text
          )
            .split(
              /[／/、,，]+/
            )
            .forEach(
              part => {

                const value =
                  clean(
                    part
                  );


                if (
                  value
                  &&
                  !values.includes(
                    value
                  )
                ) {

                  values.push(
                    value
                  );
                }
              }
            );
        }
      );


    if (
      values.length
      ===
      0
    ) {

      group
        .trackedPerformers
        .forEach(
          id => {

            const name =
              getPerformer(
                id
              ).name;


            if (
              name
              &&
              !values.includes(
                name
              )
            ) {

              values.push(
                name
              );
            }
          }
        );
    }


    return values.join(
      " / "
    );
  }

  function uniqueRecordsBySource(
    records
  ) {

    const seen =
      new Set();


    return records.filter(
      record => {

        const key = [
          record.source,
          record.sourceUrl,
        ].join(
          "|"
        );


        if (
          seen.has(
            key
          )
        ) {

          return false;
        }


        seen.add(
          key
        );


        return true;
      }
    );
  }


  function getGroupTicketOptions(
    group
  ) {

    const result =
      [];


    const seen =
      new Set();


    group.records
      .forEach(
        record => {

          const options =
            Array.isArray(
              record.ticketOptions
            )
              ?
              record.ticketOptions
              :
              [];


          options.forEach(
            option => {

              const key = [
                record.source,
                option.name,
                option.type,
                option.price,
                option.status,
              ].join(
                "|"
              );


              if (
                seen.has(
                  key
                )
              ) {

                return;
              }


              seen.add(
                key
              );


              result.push({
                ...option,

                source:
                  record.source,
              });
            }
          );
        }
      );


    return result;
  }

  function getNewGroups() {

    const now =
      Date.now();


    return visibleGroups()
      .filter(
        group => {

          if (
            !group.newUntil
          ) {

            return false;
          }


          const time =
            Date.parse(
              group.newUntil
            );


          return (
            Number.isFinite(
              time
            )
            &&
            time
            >
            now
          );
        }
      );
  }

  function getSaleItems() {

    const result =
      [];


    const seen =
      new Set();


    groups.forEach(
      group => {

        group.records
          .forEach(
            record => {

              let options =
                Array.isArray(
                  record.ticketOptions
                )
                  ?
                  record.ticketOptions
                  :
                  [];


              if (
                options.length
                ===
                0
                &&
                Array.isArray(
                  record.salePeriods
                )
                &&
                record.salePeriods
                  .length
              ) {

                options = [
                  {
                    name:
                      "チケット",

                    type:
                      "",

                    status:
                      record.ticketStatus
                      ||
                      "",

                    price:
                      "",

                    salePeriods:
                      record.salePeriods,
                  }
                ];
              }


              options.forEach(
                option => {

                  const periods =
                    Array.isArray(
                      option.salePeriods
                    )
                    &&
                    option.salePeriods
                      .length
                      ?
                      option.salePeriods
                      :
                      (
                        option.saleStartAt
                          ?
                          [
                            {
                              category:
                                option.saleCategory
                                ||
                                "",

                              label:
                                option.saleLabel
                                ||
                                "",

                              startAt:
                                option.saleStartAt
                                ||
                                "",

                              endAt:
                                option.saleEndAt
                                ||
                                "",
                            }
                          ]
                          :
                          []
                      );


                  periods.forEach(
                    period => {

                      if (
                        !period.startAt
                      ) {

                        return;
                      }


                      const key = [
                        group.key,
                        record.source,
                        option.name,
                        option.type,
                        period.category,
                        period.startAt,
                      ].join(
                        "|"
                      );


                      if (
                        seen.has(
                          key
                        )
                      ) {

                        return;
                      }


                      seen.add(
                        key
                      );


                      result.push({
                        group,
                        record,
                        option,
                        period,
                      });
                    }
                  );
                }
              );
            }
          );
      }
    );


    return result;
  }

    getSaleItems()
      .forEach(
        item => {

          const category =
            item.period.category;


          const start =
            new Date(
              item.period.startAt
            );


          const end =
            item.period.endAt
              ?
              new Date(
                item.period.endAt
              )
              :
              null;


          if (
            Number.isNaN(
              start.getTime()
            )
          ) {

            return;
          }


          if (
            category
            ===
            "advance"
            &&
            end
            &&
            start
            <=
            now
            &&
            now
            <=
            end
          ) {

            advance.push(
              item
            );

            return;
          }


          if (
            category
            ===
            "first_come"
            &&
            start
            >
            now
            &&
            start
            <=
            nearEnd
          ) {

            firstCome.push(
              item
            );

            return;
          }


          if (
            category
            ===
            "first_come"
            &&
            start
            <=
            now
            &&
            start
            >=
            startedCutoff
          ) {

            started.push(
              item
            );
          }
        }
      );


    advance.sort(
      (
        a,
        b
      ) =>
        Date.parse(
          a.period.endAt
        )
        -
        Date.parse(
          b.period.endAt
        )
    );


    firstCome.sort(
      (
        a,
        b
      ) =>
        Date.parse(
          a.period.startAt
        )
        -
        Date.parse(
          b.period.startAt
        )
    );


    started.sort(
      (
        a,
        b
      ) =>
        Date.parse(
          b.period.startAt
        )
        -
        Date.parse(
          a.period.startAt
        )
    );


    return {
      advance,
      firstCome,
      started,
    };
  }

  /* =========================================

  ========================================= */

  function renderSearchPage() {

    pageSection.innerHTML = `
      <h2 class="page-title">
        ライブを検索
      </h2>

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="公演名・会場・出演者を検索"
        autocomplete="off"
      >

      <div id="searchResults"></div>
    `;


    const input =
      document.getElementById(
        "searchInput"
      );


    const results =
      document.getElementById(
        "searchResults"
      );


    function runSearch() {

      const q =
        clean(
          input.value
        ).toLowerCase();


      if (
        !q
      ) {

        results.innerHTML = `
          <div class="empty-message">
            検索ワードを入力してください。
          </div>
        `;

        return;
      }


      const found =
        visibleGroups()
          .filter(
            group => {

              const trackedNames =
                group
                  .trackedPerformers
                  .map(
                    id =>
                      getPerformer(
                        id
                      ).name
                  )
                  .join(
                    " "
                  );


              const haystack = [
                group.title,
                group.venue,
                trackedNames,
                ...group.performersText,
              ]
                .join(
                  " "
                )
                .toLowerCase();


              return (
                haystack.includes(
                  q
                )
              );
            }
          );


      results.innerHTML =
        found.length
          ?
          found.map(
            group => `
              <button
                class="result-row"
                data-event-key="${escapeHtml(
                  group.key
                )}"
              >

                <div class="result-date">
                  ${escapeHtml(
                    group.date
                  )}

                  ${escapeHtml(
                    group.startTime
                  )}
                </div>

                <div class="result-title">
                  ${escapeHtml(
                    group.title
                  )}
                </div>

                <div class="result-sub">
                  ${escapeHtml(
                    group.venue
                  )}
                </div>

              </button>
            `
          ).join("")
          :
          `
            <div class="empty-message">
              見つかりませんでした。
            </div>
          `;


      bindEventRows(
        results
      );
    }


    input.addEventListener(
      "input",
      runSearch
    );


    runSearch();
  }

  /* =========================================
     COAPPEARANCE
  ========================================= */

  function renderCoappearancePage() {

    const pairs =
      [];


    for (
      let i = 0;
      i < performers.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < performers.length;
        j++
      ) {

        const a =
          performers[i];


        const b =
          performers[j];


        const count =
          groups.filter(
            group =>
              group
                .trackedPerformers
                .includes(
                  a.id
                )
              &&
              group
                .trackedPerformers
                .includes(
                  b.id
                )
          ).length;


        pairs.push({
          a,
          b,
          count,
        });
      }
    }


    pageSection.innerHTML = `
      <h2 class="page-title">
        共演検索
      </h2>

      <div class="page-subtitle">
        追跡中の3組が同じ公演に出演する回数です。
      </div>

      ${
        pairs.map(
          pair => `
            <div class="content-card">

              <div class="content-card-title">

                ${escapeHtml(
                  pair.a.name
                )}

                ×

                ${escapeHtml(
                  pair.b.name
                )}

              </div>

              <div class="content-card-sub">
                ${pair.count}公演
              </div>

            </div>
          `
        ).join("")
      }
    `;
  }

  function renderSettingsPage() {

    pageSection.innerHTML = `
      <h2 class="page-title">
        設定
      </h2>

      <div class="content-card">

        <div class="content-card-title">
          カレンダーに表示する芸人
        </div>

        ${
          performers
            .map(
              performer => `
                <div class="settings-row">

                  <div
                    style="
                      display:flex;
                      align-items:center;
                      gap:10px;
                    "
                  >

                    <span
                      class="legend-dot"
                      style="
                        background:
                        ${escapeHtml(
                          performer.color
                        )}
                      "
                    ></span>

                    <strong>
                      ${escapeHtml(
                        performer.name
                      )}
                    </strong>

                  </div>

                  <button
                    class="
                      toggle
                      ${
                        visiblePerformers
                          .has(
                            performer.id
                          )
                          ?
                          "on"
                          :
                          ""
                      }
                    "
                    data-toggle-performer="${escapeHtml(
                      performer.id
                    )}"
                  ></button>

                </div>
              `
            )
            .join("")
        }

      </div>

      <button
        id="clearFavorites"
        class="favorite-button"
      >
        ⭐ 行きたいライブをすべて解除
      </button>
    `;


    pageSection
      .querySelectorAll(
        "[data-toggle-performer]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const id =
                button.dataset
                  .togglePerformer;


              if (
                visiblePerformers
                  .has(
                    id
                  )
              ) {

                if (
                  visiblePerformers.size
                  ===
                  1
                ) {

                  return;
                }


                visiblePerformers
                  .delete(
                    id
                  );


                /*
                  設定で非表示にした芸人は
                  上部選択からも外す
                */
                activePerformerFilters
                  .delete(
                    id
                  );

              } else {

                visiblePerformers
                  .add(
                    id
                  );
              }


              saveVisible();


              renderLegend();

              renderCalendar();

              renderSelectedDay();

              renderSettingsPage();

              updateDrawerBadges();
            }
          );
        }
      );


    document
      .getElementById(
        "clearFavorites"
      )
      .addEventListener(
        "click",
        () => {

          favorites.clear();

          saveFavorites();

          updateDrawerBadges();


          alert(
            "行きたいライブを解除しました。"
          );
        }
      );
  }

  /* =========================================
     BADGES
  ========================================= */

  function updateDrawerBadges() {

    const newCount =
      getNewGroups()
        .length;


    const favoriteCount =
      groups.filter(
        group =>
          favorites.has(
            group.key
          )
      ).length;


    const sales =
      getSaleGroups();


    const saleCount =
      sales.advance.length
      +
      sales.firstCome.length
      +
      sales.started.length;


    setBadge(
      "newBadge",
      newCount
    );


    setBadge(
      "favoriteBadge",
      favoriteCount
    );


    setBadge(
      "saleBadge",
      saleCount
    );
  }


  function setBadge(
    id,
    count
  ) {

    const element =
      document.getElementById(
        id
      );


    if (
      !element
    ) {

      return;
    }


    element.textContent =
      String(
        count
      );


    element.style.display =
      count
      >
      0
        ?
        ""
        :
        "none";
  }
