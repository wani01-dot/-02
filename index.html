<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f5f7fa"
  >

  <title>ワラいどっとこむ</title>

  <link rel="stylesheet" href="site.css">
</head>

<body>

<main class="app">

  <header class="app-header">

    <svg
      class="brand-logo"
      viewBox="0 0 100 100"
      aria-hidden="true"
    >

      <circle
        cx="50"
        cy="53"
        r="37"
        fill="#fff"
      />

      <path
        d="
          M15 49
          C15 20 34 9 52 9
          c22 0 35 13 36 33
          -12-2-25-8-34-17
          -8 12-20 20-39 24z
        "
        fill="#101827"
      />

      <circle
        cx="36"
        cy="52"
        r="5"
        fill="#101827"
      />

      <circle
        cx="65"
        cy="52"
        r="5"
        fill="#101827"
      />

      <path
        d="M37 70c8 8 19 8 27 0"
        fill="none"
        stroke="#101827"
        stroke-width="6"
        stroke-linecap="round"
      />

    </svg>

    <div class="brand-text">

      <h1 class="brand-title">
        ワラいどっとこむ
      </h1>

      <div class="brand-subtitle">
        お笑いライブのスケジュール
      </div>

    </div>

    <button
      id="menuButton"
      class="menu-button"
      aria-label="メニュー"
    >
      ☰
    </button>

  </header>

  <div
    id="legend"
    class="legend"
  ></div>

  <div id="calendarView">

    <section
      class="surface calendar-card"
    >

      <div class="month-header">

        <button
          id="prevMonth"
          class="month-button"
          aria-label="前の月"
        >
          ‹
        </button>

        <div
          id="monthTitle"
          class="month-title"
        ></div>

        <button
          id="nextMonth"
          class="month-button"
          aria-label="次の月"
        >
          ›
        </button>

      </div>

      <div class="week-row">
        <div class="weekday">月</div>
        <div class="weekday">火</div>
        <div class="weekday">水</div>
        <div class="weekday">木</div>
        <div class="weekday">金</div>
        <div class="weekday">土</div>
        <div class="weekday">日</div>
      </div>

      <div
        id="calendarGrid"
        class="calendar-grid"
      ></div>

    </section>

    <section
      id="daySection"
      class="surface day-section"
    ></section>

  </div>

  <section
    id="pageSection"
    class="surface page-section"
  ></section>

</main>

<div
  id="drawerOverlay"
  class="drawer-overlay"
>

  <aside
    id="drawer"
    class="drawer"
  >

    <button
      id="drawerClose"
      class="drawer-close"
    >
      ×
    </button>

    <div class="drawer-title">
      ワラいどっとこむ
    </div>

    <div class="drawer-subtitle">
      今日のライブ追いかけよう
    </div>

    <div class="drawer-menu">

      <button
        class="drawer-item active"
        data-page="calendar"
      >
        <span class="drawer-icon">▣</span>
        カレンダー
      </button>

      <button
        class="drawer-item"
        data-page="new"
      >
        <span class="drawer-icon">✨</span>

        新着ライブ

        <span
          id="newBadge"
          class="drawer-badge"
        >
          0
        </span>
      </button>

      <button
        class="drawer-item"
        data-page="favorites"
      >
        <span class="drawer-icon">⭐</span>

        行きたいライブ

        <span
          id="favoriteBadge"
          class="drawer-badge"
        >
          0
        </span>
      </button>

      <button
        class="drawer-item"
        data-page="sales"
      >
        <span class="drawer-icon">🎫</span>

        販売開始が近いもの

        <span
          id="saleBadge"
          class="drawer-badge"
        >
          0
        </span>
      </button>

      <div class="drawer-divider"></div>

      <button
        class="drawer-item"
        data-page="search"
      >
        <span class="drawer-icon">⌕</span>
        ライブを検索
      </button>

      <button
        class="drawer-item"
        data-page="performers"
      >
        <span class="drawer-icon">♟</span>
        出演者一覧
      </button>

      <button
        class="drawer-item"
        data-page="coappearance"
      >
        <span class="drawer-icon">🎭</span>
        共演検索
      </button>

      <div class="drawer-divider"></div>

      <button
        class="drawer-item"
        data-page="settings"
      >
        <span class="drawer-icon">⚙</span>
        設定
      </button>

      <button
        class="drawer-item"
        data-page="help"
      >
        <span class="drawer-icon">?</span>
        ヘルプ・使い方
      </button>

    </div>

    <div class="drawer-version">
      v2.5.0
    </div>

  </aside>

</div>

<div
  id="sheetOverlay"
  class="sheet-overlay"
>

  <div
    id="sheet"
    class="sheet"
  ></div>

</div>

<script src="site.js"></script>

<script src="stream-calendar.js"></script>

</body>
</html>
