
name: Fast FANY test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-events-and-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Chromium
        run: |
          python -m playwright install chromium

      - name: Test FANY scraper speed
        run: |
          echo "================================"
          echo "FANY 高速取得テスト開始"
          echo "================================"

          START_TIME=$(date +%s)

          python -u fast_fany.py

          END_TIME=$(date +%s)

          ELAPSED=$((END_TIME - START_TIME))

          echo "================================"
          echo "FANY取得処理時間: ${ELAPSED}秒"
          echo "================================"
