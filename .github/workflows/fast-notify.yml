
name: Fast notification test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-events-and-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Chromium
        run: |
          python -m playwright install chromium

      - name: Check notification environment
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          python - <<'PY'
          import os

          token = bool(
              os.environ.get(
                  "LINE_CHANNEL_ACCESS_TOKEN"
              )
          )

          destination = bool(
              os.environ.get(
                  "LINE_TO"
              )
          )

          print("LINE token configured:", token)
          print("LINE destination configured:", destination)

          if not token or not destination:
              raise SystemExit(
                  "LINE notification settings are missing"
              )

          print("Fast notification preparation OK")
          PY
