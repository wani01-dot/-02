
name: Fast notification test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-events-and-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Chromium
        run: |
          python -m playwright install chromium

      # ======================================
      # FANYを3組並列で高速取得
      # ======================================
      - name: Fast FANY scraping
        run: |
          python -u fast_fany.py

      # ======================================
      # 新規公演を判定
      # LINEは送信しない
      # ======================================
      - name: Preview new FANY notifications
        run: |
          python -u fast_fany_notify.py

      # ======================================
      # 結果確認
      # ======================================
      - name: Test completed
        run: |
          echo "================================"
          echo "FANY高速通知テスト完了"
          echo "LINE送信なし"
          echo "通知履歴の変更なし"
          echo "================================"
