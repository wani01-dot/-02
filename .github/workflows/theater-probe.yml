name: FANY and theater acquisition probe

on:
  workflow_dispatch:
    inputs:
      other_tickets:
        description: "Also inspect TIGET, eplus, and LivePocket"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt playwright

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Inspect public FANY and theater data
        shell: bash
        env:
          OTHER_TICKETS: ${{ inputs.other_tickets }}
        run: |
          set -o pipefail
          args=()
          if [[ "$OTHER_TICKETS" == true ]]; then args+=(--other-tickets); fi
          python -u acquisition_probe.py "${args[@]}" | tee "$RUNNER_TEMP/acquisition-probe.log"

      - name: Write acquisition summary
        if: ${{ always() && steps.setup-python.outcome == 'success' }}
        run: |
          python acquisition_summary.py "$RUNNER_TEMP/acquisition-probe.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acquisition and comparison log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-probe
          path: ${{ runner.temp }}/acquisition-probe.log
          retention-days: 7
