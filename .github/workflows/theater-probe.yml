name: Theater schedule test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Chromium
        run: |
          python -m playwright install chromium

      - name: Run theater scraper
        run: |
          python theater_scraper.py

      - name: Show theater events
        run: |
          echo "=== theater_events.json ==="
          cat theater_events.json

      - name: Upload theater events
        uses: actions/upload-artifact@v4
        with:
          name: theater-events
          path: theater_events.json
