name: FANY and theater acquisition probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt playwright

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Inspect public FANY and theater data
        shell: bash
        run: |
          set -o pipefail
          python -u acquisition_probe.py | tee "$RUNNER_TEMP/acquisition-probe.log"

      - name: Upload acquisition and comparison log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-probe
          path: ${{ runner.temp }}/acquisition-probe.log
          retention-days: 7
