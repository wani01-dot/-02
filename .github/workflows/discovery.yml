name: ライブ発見レーダー

on:
  workflow_dispatch:

  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: TicketDive公開ページ取得
        run: |
          python -m pip install -r requirements.txt
          python ticketdive_scraper.py

      - name: 発見データ作成
        run: |
          python discovery_build.py

      - name: 月別公演数チェック
        run: |
          python - <<'PYCODE'
          import json
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          today = datetime.now(timezone(timedelta(hours=9))).date()
          next_month = (today.replace(day=28) + timedelta(days=4)).replace(day=1).strftime('%Y-%m')
          for name in ('theater_events.json', 'ticketdive_events.json', 'discovered_events.json'):
              with open(name, encoding='utf-8') as f:
                  data = json.load(f)
              events = data if isinstance(data, list) else data.get('events', [])
              counts = Counter(str(e.get('date', ''))[:7] for e in events)
              print(name, dict(sorted(counts.items())))
              if counts.get(next_month, 0) == 0:
                  print(f'WARNING: {name} に翌月 {next_month} の公演が0件です')
          PYCODE

      - name: 変更確認
        run: |
          git status

      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add discovered_events.json ticketdive_events.json

          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi

          git commit -m "Update discovered live events"

          for i in 1 2 3
          do
            git pull --rebase origin main || true

            if git push; then
              exit 0
            fi

            sleep 5
          done

          exit 1
