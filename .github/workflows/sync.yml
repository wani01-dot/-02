name: Sync events and deploy Pages

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# ==========================================
# 同時に複数の同期処理を走らせない
# ==========================================
concurrency:
  group: sync-events-and-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # GitHubのファイルを取得
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 実行開始時点の最新mainに合わせる
      # ==========================================
      - name: Update to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      # ==========================================
      # Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # 必要なライブラリ
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ==========================================
      # FANY + TIGET + イープラス等を取得
      # ==========================================
      - name: Scrape events
        run: |
          python scraper.py

          if [ ! -f new_events.json ]; then
            echo "[]" > new_events.json
          fi

          echo "=== new_events.json ==="
          cat new_events.json

      # ==========================================
      # 本当に新しい公演だけLINE通知
      # ==========================================
      - name: Notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          python notify_line.py

      # ==========================================
      # events.json
      # notified_events.json
      # をGitHubに保存
      #
      # rebaseは使わず、
      # 最新mainを土台に生成済みJSONを載せ直す
      # ==========================================
      - name: Save updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 今回生成したファイルを一時退避
          cp events.json /tmp/events.json

          if [ -f notified_events.json ]; then
            cp notified_events.json /tmp/notified_events.json
          fi

          SAVE_SUCCESS=false

          for ATTEMPT in 1 2 3
          do
            echo "================================"
            echo "Save attempt: ${ATTEMPT}/3"
            echo "================================"

            # 保存直前の最新mainを取得
            git fetch origin main
            git reset --hard origin/main

            # 今回生成したデータを戻す
            cp /tmp/events.json events.json

            if [ -f /tmp/notified_events.json ]; then
              cp /tmp/notified_events.json notified_events.json
            fi

            git add events.json

            if [ -f notified_events.json ]; then
              git add notified_events.json
            fi

            # 変更がなければ保存不要
            if git diff --cached --quiet; then
              echo "No changes to save."
              SAVE_SUCCESS=true
              break
            fi

            git commit -m "Update events and notification history"

            # push成功なら終了
            if git push origin HEAD:main; then
              echo "Push succeeded."
              SAVE_SUCCESS=true
              break
            fi

            echo "Push failed because main changed."
            echo "Retrying with the latest main..."

            sleep 2
          done

          if [ "$SAVE_SUCCESS" != "true" ]; then
            echo "Failed to save after 3 attempts."
            exit 1
          fi

      # ==========================================
      # GitHub Pages用設定
      # ==========================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ==========================================
      # サイト一式をアップロード
      # ==========================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  # ============================================
  # GitHub Pagesへ公開
  # ============================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: sync

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
