name: Sync events and deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ==================================================
      # 今ある予定を全部「通知済み」にする
      # この初期化版では scraper.py より先に実行
      # ==================================================
      - name: Initialize notified events
        run: |
          python initialize_notified.py

          echo "=== notified_events.json ==="
          cat notified_events.json

      # ==================================================
      # FANY + TIGETを取得
      # ==================================================
      - name: Scrape events
        run: |
          python scraper.py

          if [ ! -f new_events.json ]; then
            echo "new_events.json not found. Creating empty file."
            echo "[]" > new_events.json
          fi

          echo "=== new_events.json ==="
          cat new_events.json

      # ==================================================
      # LINE通知
      # ==================================================
      - name: Notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          python notify_line.py

      # ==================================================
      # events.json と通知済み履歴をGitHubへ保存
      # ==================================================
      - name: Save updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json

          if [ -f notified_events.json ]; then
            git add notified_events.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update events and notification history"
            git push
          fi
