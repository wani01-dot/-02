name: Sync events and deploy Pages

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:

  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      - name: Scrape events
        run: |
          python scraper.py

          if [ ! -f new_events.json ]; then
            echo "new_events.json not found. Creating empty file."
            echo "[]" > new_events.json
          fi

          echo "=== new_events.json ==="
          cat new_events.json


      - name: Notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          python notify_line.py


      - name: Save updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json notified_events.json

          if git diff --cached --quiet; then
            echo "No event changes to save."
          else
            git commit -m "Update event calendar"
            git push
          fi


      - name: Configure Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."


  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: sync

    permissions:
      pages: write
      id-token: write

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
