
name: Sync events and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-events-and-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ======================================
      # 最新のmainを取得
      # ======================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      # ======================================
      # Python
      # ======================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Chromium
        run: |
          python -m playwright install chromium

      # ======================================
      # FANY高速取得
      #
      # 失敗時は通常同期を継続
      # ======================================
      - name: Fast FANY scraping
        id: fast_fany
        continue-on-error: true
        run: |
          echo "FANY高速取得開始"
          python -u fast_fany.py

      # ======================================
      # FANY高速通知の確認
      #
      # まだLINE送信しない
      # ======================================
      - name: Fast FANY notification preview
        if: steps.fast_fany.outcome == 'success'
        env:
          FAST_FANY_SEND: "false"
        run: |
          python -u fast_fany_send.py

      # ======================================
      # 通常サイト + 劇場公式
      # ======================================
      - name: Scrape ticket sites and theaters
        run: |
          echo "================================"
          echo "通常サイト + 劇場公式 同時取得開始"
          echo "================================"

          python scraper.py > /tmp/ticket_scraper.log 2>&1 &
          TICKET_PID=$!

          python theater_scraper.py > /tmp/theater_scraper.log 2>&1 &
          THEATER_PID=$!

          set +e

          wait "$TICKET_PID"
          TICKET_STATUS=$?

          wait "$THEATER_PID"
          THEATER_STATUS=$?

          set -e

          echo ""
          echo "================================"
          echo "通常サイト取得ログ"
          echo "================================"
          cat /tmp/ticket_scraper.log

          echo ""
          echo "================================"
          echo "劇場公式取得ログ"
          echo "================================"
          cat /tmp/theater_scraper.log

          echo ""
          echo "================================"
          echo "取得結果"
          echo "================================"

          echo "通常サイト status: $TICKET_STATUS"
          echo "劇場公式 status: $THEATER_STATUS"

          if [ "$TICKET_STATUS" -ne 0 ]; then
            echo "通常サイトの取得に失敗しました。"
            exit 1
          fi

          if [ "$THEATER_STATUS" -ne 0 ]; then
            echo "劇場取得失敗。劇場通知をスキップします。"

            cat > theater_events.json <<'EOF'
          {
            "syncedAt": null,
            "events": []
          }
          EOF
          fi

          if [ ! -f new_events.json ]; then
            echo "[]" > new_events.json
          fi

          if [ ! -f theater_events.json ]; then
            cat > theater_events.json <<'EOF'
          {
            "syncedAt": null,
            "events": []
          }
          EOF
          fi

      # ======================================
      # 取得結果確認
      # ======================================
      - name: Show scrape summary
        run: |
          echo "=== new_events.json ==="
          cat new_events.json

          echo ""
          echo "=== theater event count ==="

          python - <<'PY'
          import json

          try:
              with open(
                  "theater_events.json",
                  "r",
                  encoding="utf-8",
              ) as f:
                  data = json.load(f)

              if isinstance(data, list):
                  events = data
              else:
                  events = data.get("events", [])

              print("劇場公式取得:", len(events), "件")

          except Exception as error:
              print(
                  "theater_events.json確認失敗:",
                  error,
              )
          PY

      # ======================================
      # 既存LINE通知
      #
      # FANY / TIGET / イープラス /
      # LivePocket / 劇場公式
      # ======================================
      - name: Notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          python notify_line.py

      # ======================================
      # 更新データをGitHubへ保存
      # ======================================
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp events.json /tmp/events.json

          if [ -f notified_events.json ]; then
            cp notified_events.json /tmp/notified_events.json
          fi

          if [ -f theater_notified_events.json ]; then
            cp theater_notified_events.json /tmp/theater_notified_events.json
          fi

          if [ -f theater_events.json ]; then
            cp theater_events.json /tmp/theater_events.json
          fi

          SAVE_SUCCESS=false

          for ATTEMPT in 1 2 3
          do
            echo "Save attempt: ${ATTEMPT}/3"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/events.json events.json

            if [ -f /tmp/notified_events.json ]; then
              cp /tmp/notified_events.json notified_events.json
            fi

            if [ -f /tmp/theater_notified_events.json ]; then
              cp /tmp/theater_notified_events.json theater_notified_events.json
            fi

            if [ -f /tmp/theater_events.json ]; then
              cp /tmp/theater_events.json theater_events.json
            fi

            git add events.json

            if [ -f notified_events.json ]; then
              git add notified_events.json
            fi

            if [ -f theater_notified_events.json ]; then
              git add theater_notified_events.json
            fi

            if [ -f theater_events.json ]; then
              git add theater_events.json
            fi

            if git diff --cached --quiet; then
              echo "No changes to save."
              SAVE_SUCCESS=true
              break
            fi

            git commit -m "Update events and notification history"

            if git push origin HEAD:main; then
              echo "Push succeeded."
              SAVE_SUCCESS=true
              break
            fi

            echo "Push failed. Retrying..."
            sleep 2
          done

          if [ "$SAVE_SUCCESS" != "true" ]; then
            echo "Failed to save after 3 attempts."
            exit 1
          fi

      # ======================================
      # GitHub Pages
      # ======================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  # ========================================
  # Pagesへ公開
  # ========================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: sync

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
