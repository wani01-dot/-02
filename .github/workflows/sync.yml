name: Sync events and deploy Pages

on:
  workflow_dispatch:
    inputs:
      requeue_record:
        description: "Exact legacy record key (leave empty for regular sync)"
        type: string
      requeue_evidence:
        description: "Evidence of confirmed non-delivery (no personal data)"
        type: string
      requeue_confirm:
        description: "Send the reviewed legacy record now"
        type: boolean
        default: false
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-events-and-pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt playwright

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Configure git for catalog and notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read run timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if timing=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq '"RUN_CREATED_AT=" + (.created_at // "") + "\nRUN_STARTED_AT=" + (.run_started_at // "")'); then
            printf '%s\n' "$timing" >> "$GITHUB_ENV"
          else
            echo 'Run timing metadata is unavailable'
          fi

      - name: Collect and notify as sources finish
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          LINE_REQUEUE_RECORD: ${{ inputs.requeue_record }}
          LINE_REQUEUE_EVIDENCE: ${{ inputs.requeue_evidence }}
          LINE_REQUEUE_CONFIRM: ${{ inputs.requeue_confirm }}
        shell: bash
        run: |
          set -o pipefail
          python -u notification_pipeline.py | tee "$RUNNER_TEMP/notification-sync.log"

      - name: Write sync summary
        if: ${{ always() && steps.setup-python.outcome == 'success' }}
        run: python sync_summary.py "$RUNNER_TEMP/notification-sync.log" >> "$GITHUB_STEP_SUMMARY"
